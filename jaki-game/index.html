<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>シャキ城奪還作戦</title>
<style>
  /* ===== 画面全体のスタイル ===== */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #111; color: #eee;
    overflow: hidden;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    touch-action: none;              /* スマホでスクロール・拡大させない */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* ===== タッチ操作用ボタン ===== */
  #pad {
    position: fixed; left: 20px; bottom: 20px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.25);
    touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    pointer-events: none;
  }
  #pad::before, #pad::after { content: ""; position: absolute; background: rgba(255,255,255,0.15); }
  #pad::before { left: 50%; top: 12px; bottom: 12px; width: 2px; margin-left: -1px; }
  #pad::after  { top: 50%; left: 12px; right: 12px; height: 2px; margin-top: -1px; }

  .btn {
    position: fixed; border-radius: 50%;
    color: #fff; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #actBtn {
    right: 24px; bottom: 36px; width: 96px; height: 96px; font-size: 16px;
    background: rgba(220,80,60,0.35); border: 2px solid rgba(255,160,140,0.6);
  }
  #actBtn.on { background: rgba(220,80,60,0.7); }
  #crouchBtn {
    right: 132px; bottom: 24px; width: 64px; height: 64px; font-size: 13px;
    background: rgba(80,120,220,0.35); border: 2px solid rgba(158,195,255,0.6);
  }
  #crouchBtn.on { background: rgba(80,120,220,0.75); }
  /* ブルーウォーカーのハッキング */
  #hackBtn {
    right: 132px; bottom: 100px; width: 64px; height: 64px; font-size: 13px;
    background: rgba(220,80,180,0.35); border: 2px solid rgba(255,150,230,0.7);
  }
  #hackBtn.off { opacity: 0.35; }
  #soundBtn {
    right: 10px; top: 84px; width: 44px; height: 44px; font-size: 20px;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.4);
  }
  /* タイトル画面などではパッド類を隠す */
  body.menu #pad, body.menu #actBtn, body.menu #crouchBtn, body.menu #hackBtn { display: none; }
  #voiceBtn {
    right: 60px; top: 84px; width: 44px; height: 44px; font-size: 15px;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.4);
  }
  #voiceBtn.off { opacity: 0.4; text-decoration: line-through; }
  body.menu #soundBtn, body.menu #voiceBtn { top: 10px; }
  body.nohack #hackBtn { display: none; }
  /* マウス操作のPCでは少し控えめに表示 */
  @media (hover: hover) and (pointer: fine) {
    #pad, #actBtn, #crouchBtn, #hackBtn { opacity: 0.45; }
  }
</style>
</head>
<body class="menu">
<canvas id="game"></canvas>
<div id="pad"><div id="knob"></div></div>
<div id="actBtn" class="btn">ACTION</div>
<div id="crouchBtn" class="btn">ほふく</div>
<div id="hackBtn" class="btn">ハック</div>
<div id="soundBtn" class="btn">🔊</div>
<div id="voiceBtn" class="btn">声</div>

<script>
'use strict';

/* =========================================================
   基本設定（数字を変えると難易度を調整できる）
   ========================================================= */
const TILE = 40;                 // 1マスの大きさ（ピクセル）
const PLAYER_SPEED = 150;        // 通常の移動速度（px/秒）
const CROUCH_SPEED = 70;         // ほふく時の移動速度
const PLAYER_R = 12;             // 先頭の当たり判定の半径
const MEMBER_R = 10;             // 後ろの隊員の当たり判定の半径
const GUARD_R = 13;              // 見張りの当たり判定の半径
const VIEW_RANGE = 215;          // 見張りの視界の距離
const VIEW_ANGLE = Math.PI / 2.6;// 見張りの視野角（全体）
const CAMERA_RANGE = 180;        // 監視カメラの視界の距離
const CROUCH_RANGE_RATE = 0.6;   // ほふく中は見つかる距離が短くなる
const STUN_TIME = 9;             // 麻酔で眠らせる時間（秒）
const PLAYER_VIEW_RANGE = 190;   // 先頭の視界（麻酔銃の射程）
const PLAYER_VIEW_ANGLE = Math.PI / 2.8;
const SHOT_COOLDOWN = 1.5;       // 麻酔銃を撃ってから次に撃てるまでの時間（秒）
const CAUGHT_PENALTY = 30;       // 見張りに捕まった時に上がる警戒度
const LASER_PENALTY = 34;        // 赤外線に触れた時に上がる警戒度
const SUSPECT_BASE = 0.5;        // 見張りが怪しむ速さ（基本）
const SUSPECT_NEAR = 1.8;        // 見張りが怪しむ速さ（近いほど加算）
const ALERT_PER_SEC = 18;        // 発見されている間に毎秒上がる警戒度
const ALERT_DECAY = 6;           // 見つかっていない間に毎秒下がる警戒度
const CHASE_SPEED = 120;         // 見張りが追いかける速さ
const AMMO_PICKUP = 2;           // 弾薬箱で増える麻酔弾の数
const HACK_TIME = 8;             // ハッキングでカメラ・ライトを止める時間（秒）
const SQUAD_GAP = 22;            // 隊員どうしの間隔（ピクセル）

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* =========================================================
   登場人物（隊員の色・会話の顔アイコン）
   ========================================================= */
const ROLES = {
  nogi:    { name: '乃木',     body: '#2d3e55', rim: '#9ec3ff' },
  shinjo:  { name: '新庄',     body: '#2f4a36', rim: '#9fe0a8' },
  chokky:  { name: 'チョッキー', body: '#4a3a2d', rim: '#ffb26b' },
  y2k:     { name: 'Y2K',      body: '#3a4a5e', rim: '#7fa3d6' },
  rescued: { name: '別班員',   body: '#e8e4da', rim: '#ffd54f' },
};
// 会話に出てくる人の色
const SPEAKERS = {
  '乃木': '#9ec3ff', 'ノコル': '#c59bff', '新庄': '#9fe0a8', 'チョッキー': '#ffb26b',
  '東条': '#6fe3e0', '太田': '#ff9ee0', 'ナレーション': '#bbbbbb',
};
// 突入部隊10人：乃木・新庄・チョッキー・Y2K部隊7人
const TEAM10 = ['nogi', 'shinjo', 'chokky', 'y2k', 'y2k', 'y2k', 'y2k', 'y2k', 'y2k', 'y2k'];

/* =========================================================
   効果音・BGM（Web Audio API で音を合成。音声ファイルは使わない）
   ・スマホは画面に触れるまで音を出せないので、最初の操作で unlock() する
   ========================================================= */
const Sound = (() => {
  let ac = null, master = null, bgmGain = null;
  let muted = false;
  let bgmTimer = null, nextTime = 0, step = 0;
  let tense = false;      // 見つかっている時はBGMを緊迫させる
  let theme = 0;
  let drone = null, wind = null;

  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      // iPhoneのマナーモードでも音が出るようにする（対応ブラウザのみ）
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      ac = new AC();
      // 音を大きくしても割れないようにコンプレッサーを通す
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      comp.connect(ac.destination);
      master = ac.createGain();
      master.gain.value = muted ? 0 : 1.2;
      master.connect(comp);
      bgmGain = ac.createGain();
      bgmGain.gain.value = 0.6;
      bgmGain.connect(master);
    }
    if (ac.state === 'suspended') ac.resume();
  }

  // 時刻 t に音を鳴らす（周波数 f1 → f2 へ変化）
  function toneAt(t, f1, f2, dur, type, vol, out) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out || master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function tone(f1, f2, dur, type = 'square', vol = 0.2, delay = 0) {
    if (!ac) return;
    toneAt(ac.currentTime + delay, f1, f2, dur, type, vol);
  }
  // ノイズ音（足音・発射音・ハイハットなど）
  let noiseBuf = null;
  function getNoise() {
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }
  function noiseAt(t, dur, vol, freq, out, type = 'bandpass') {
    const src = ac.createBufferSource(); src.buffer = getNoise();
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(out || master);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }
  function noise(dur, vol = 0.2, freq = 1000, delay = 0) {
    if (!ac) return;
    noiseAt(ac.currentTime + delay, dur, vol, freq);
  }

  /* ---- BGM ----（16拍で1周。0は休み。半音でぶつかる音で不安な響きに） */
  const N = { G2:98, Ab2:103.8, A2:110, Bb2:116.5, C3:130.8, Db3:138.6, D3:146.8, Eb3:155.6, E3:164.8, F3:174.6,
              A3:220, Bb3:233.1, A4:440, Bb4:466.2, C5:523.3, Db5:554.4, D5:587.3, Eb5:622.3, E5:659.3, F5:698.5 };
  const THEMES = [
    { bass: [N.A2,0,0,N.A2, 0,0,N.A2,0, N.Bb2,0,0,N.Bb2, 0,0,N.Ab2,0],   // 0：荒野
      lead: [N.E5,0,0,0, 0,0,0,0, N.F5,0,0,0, 0,0,N.E5,0], drone: N.A2, stepDur: 0.2 },
    { bass: [N.D3,0,N.D3,0, N.D3,0,N.Eb3,0, N.D3,0,N.D3,0, N.C3,0,N.Db3,0], // 1：中庭
      lead: [N.A4,0,0,N.Bb4, 0,0,0,0, N.D5,0,0,N.Eb5, 0,0,N.D5,0], drone: N.D3, stepDur: 0.17 },
    { bass: [N.E3,0,0,0, 0,0,N.F3,0, N.E3,0,0,0, 0,0,N.Eb3,0],           // 2：地下（水滴）
      lead: [0,0,0,0, N.Bb4,0,0,0, 0,0,0,0, N.A4,0,0,0], drone: N.E3 / 2, stepDur: 0.24, drip: true },
    { bass: [N.C3,0,0,0, 0,0,0,0, N.Db3,0,0,0, 0,0,0,0],                 // 3：赤外線（息をひそめる）
      lead: [N.C5,0,0,0, 0,0,0,0, 0,0,N.Db5,0, 0,0,0,0], drone: N.C3, stepDur: 0.15, tickAll: true },
  ];
  // 警戒中：速いベースと、半音で上下するサイレンのようなメロディ
  const ALERT_BASS = [N.A2,N.A3,N.A2,N.A3, N.A2,N.A3,N.Bb2,N.Bb3, N.A2,N.A3,N.A2,N.A3, N.Ab2,N.Ab2,N.Bb2,N.Bb2];
  const ALERT_LEAD = [N.E5,N.F5,N.E5,N.F5, N.E5,N.F5,N.E5,N.F5, N.Eb5,N.E5,N.Eb5,N.E5, N.F5,0,N.F5,0];

  function playStep(t) {
    const th = THEMES[theme] || THEMES[0];
    const i = step % 16;
    const dur = tense ? 0.12 : th.stepDur;
    if (tense) {
      toneAt(t, ALERT_BASS[i], ALERT_BASS[i], dur * 0.9, 'sawtooth', 0.14, bgmGain);
      if (ALERT_LEAD[i]) toneAt(t, ALERT_LEAD[i], ALERT_LEAD[i], dur * 0.9, 'square', 0.07, bgmGain);
      if (i % 4 === 0) { toneAt(t, 170, 45, 0.18, 'sine', 0.6, bgmGain); noiseAt(t, 0.02, 0.2, 1500, bgmGain); }
      if (i % 8 === 4) noiseAt(t, 0.15, 0.35, 1800, bgmGain);
      noiseAt(t, 0.03, 0.10, 8000, bgmGain, 'highpass');
    } else {
      if (th.bass[i]) toneAt(t, th.bass[i], th.bass[i], dur * 1.6, 'sawtooth', 0.12, bgmGain);
      if (th.lead[i]) toneAt(t, th.lead[i], th.lead[i] * 0.985, dur * 5, 'triangle', 0.10, bgmGain);
      // 時計のチクタク
      if (th.tickAll || i % 2 === 0) toneAt(t, i % 4 === 0 ? 2400 : 1800, i % 4 === 0 ? 2400 : 1800, 0.025, 'square', 0.05, bgmGain);
      if (th.drip && Math.random() < 0.12) toneAt(t, 1400 + Math.random() * 1400, 700, 0.09, 'sine', 0.18, bgmGain);
      if (i === 0 || i === 10) { toneAt(t, 120, 40, 0.35, 'sine', 0.55, bgmGain); noiseAt(t, 0.05, 0.12, 300, bgmGain); }
    }
    step++;
    return dur;
  }
  function scheduler() {
    if (!ac) return;
    while (nextTime < ac.currentTime + 0.2) nextTime += playStep(nextTime);
  }
  function startDrone() {
    if (!ac || drone) return;
    const th = THEMES[theme] || THEMES[0];
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700; f.Q.value = 4;
    const g = ac.createGain(); g.gain.value = 0.05;
    const oscs = [th.drone, th.drone * 1.01, th.drone * 2 * 1.06].map(fr => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr;
      o.connect(f); o.start(); return o;
    });
    const lfo = ac.createOscillator(), lg = ac.createGain();
    lfo.frequency.value = 0.12; lg.gain.value = 400;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    f.connect(g); g.connect(bgmGain);
    drone = { oscs, lfo, f, g };
  }
  function stopDrone() {
    if (!drone) return;
    try { drone.oscs.forEach(o => o.stop()); drone.lfo.stop(); } catch (e) {}
    drone = null;
  }
  function startBGM(themeIndex) {
    stopBGM();
    theme = themeIndex || 0;
    step = 0; tense = false;
    if (!ac) return;
    nextTime = ac.currentTime + 0.1;
    bgmTimer = setInterval(scheduler, 50);
    startDrone();
    startWind();
  }
  function stopBGM() {
    if (bgmTimer) clearInterval(bgmTimer);
    bgmTimer = null;
    stopDrone(); stopWind();
  }
  function setTension(on) {
    if (on === tense) return;
    tense = on;
    if (drone && ac) {
      drone.f.frequency.setTargetAtTime(on ? 1800 : 700, ac.currentTime, 0.2);
      drone.g.gain.setTargetAtTime(on ? 0.09 : 0.05, ac.currentTime, 0.2);
    }
  }
  function startWind() {
    if (!ac || wind) return;
    const src = ac.createBufferSource(); src.buffer = getNoise(); src.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 0.7;
    const g = ac.createGain(); g.gain.value = 0.06;
    const lfo = ac.createOscillator(), lfoGain = ac.createGain();
    lfo.frequency.value = 0.15; lfoGain.gain.value = 300;
    lfo.connect(lfoGain); lfoGain.connect(f.frequency);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(); lfo.start();
    wind = { src, lfo };
  }
  function stopWind() {
    if (!wind) return;
    try { wind.src.stop(); wind.lfo.stop(); } catch (e) {}
    wind = null;
  }
  function toggleMute() {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 1.2;
    if (muted && window.speechSynthesis) speechSynthesis.cancel();
    const b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '🔊';
  }

  return {
    unlock, startBGM, stopBGM, setTension, toggleMute,
    isMuted: () => muted,
    step: (soft) => {
      if (!ac) return;
      const t = ac.currentTime;
      noiseAt(t, 0.07, soft ? 0.18 : 0.45, soft ? 700 : 1100);
      noiseAt(t + 0.04, 0.06, soft ? 0.12 : 0.30, soft ? 500 : 800);
      if (!soft) toneAt(t, 140, 70, 0.06, 'sine', 0.3);
    },
    crouch:  () => { tone(500, 300, 0.1, 'triangle', 0.4); noise(0.08, 0.3, 900); },
    shot:    () => { noise(0.18, 0.9, 2200); noise(0.05, 0.6, 5000); tone(1600, 300, 0.15, 'square', 0.25); tone(200, 60, 0.12, 'sine', 0.6); },
    hit:     () => { tone(400, 100, 0.35, 'square', 0.35); noise(0.25, 0.5, 500); },
    empty:   () => { tone(1500, 1500, 0.04, 'square', 0.3); tone(1500, 1500, 0.04, 'square', 0.3, 0.08); },
    pickup:  () => [880, 1175, 1568].forEach((f, i) => tone(f, f, 0.1, 'square', 0.25, i * 0.07)),
    suspect: () => { tone(740, 740, 0.12, 'square', 0.35); tone(784, 784, 0.25, 'square', 0.35, 0.12); noise(0.1, 0.2, 3000); },
    alert:   () => {
      tone(1760, 1760, 0.08, 'square', 0.5); tone(2349, 2349, 0.4, 'square', 0.45, 0.07);
      tone(1245, 1245, 0.4, 'sawtooth', 0.3, 0.07);
      tone(150, 40, 0.5, 'sine', 0.9); noise(0.4, 0.6, 600);
    },
    siren:   () => { for (let i = 0; i < 3; i++) { tone(700, 1100, 0.25, 'sawtooth', 0.35, i * 0.5); tone(1100, 700, 0.25, 'sawtooth', 0.35, i * 0.5 + 0.25); } },
    laser:   () => { for (let i = 0; i < 6; i++) tone(i % 2 ? 1400 : 1000, i % 2 ? 1400 : 1000, 0.09, 'square', 0.4, i * 0.1); },
    heart: (k) => {
      if (!ac) return;
      const t = ac.currentTime, v = 0.35 + 0.65 * k;
      toneAt(t, 110, 45, 0.15, 'sine', v); noiseAt(t, 0.04, 0.25 * v, 250);
      toneAt(t + 0.16, 95, 40, 0.18, 'sine', v * 0.8); noiseAt(t + 0.16, 0.04, 0.2 * v, 200);
    },
    door:    () => { tone(200, 120, 0.4, 'sawtooth', 0.4); noise(0.4, 0.5, 300); tone(1200, 1200, 0.05, 'square', 0.3); },
    rescue:  () => [659, 784, 988, 1319].forEach((f, i) => tone(f, f, 0.2, 'triangle', 0.4, i * 0.12)),
    hack:    () => { for (let i = 0; i < 10; i++) { const f = 800 + Math.random() * 2400; tone(f, f, 0.05, 'square', 0.18, i * 0.05); } },
    radio:   () => { noise(0.12, 0.25, 3000); tone(1800, 1800, 0.06, 'sine', 0.2, 0.12); },
    powerDown: () => { tone(400, 40, 1.2, 'sawtooth', 0.4); noise(0.5, 0.3, 200); },
    powerUp:   () => { tone(60, 500, 0.8, 'sawtooth', 0.3); },
    boom:    () => { noise(1.2, 1.0, 150, 0); noise(0.4, 0.8, 800); tone(120, 30, 1.0, 'sine', 1.0); },
    dud:     () => { tone(900, 900, 0.03, 'square', 0.3); noise(0.6, 0.25, 4000, 0.1); },
    caught:  () => { noise(0.3, 0.8, 400); tone(300, 60, 0.4, 'sawtooth', 0.5); },
    start:   () => [523, 659, 784].forEach((f, i) => tone(f, f, 0.12, 'square', 0.25, i * 0.1)),
    clear:   () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, f, i === 5 ? 0.5 : 0.18, 'square', 0.3, i * 0.14)),
    gameOver:() => [392, 370, 330, 311, 196].forEach((f, i) => tone(f, f * 0.97, 0.45, 'sawtooth', 0.35, i * 0.28)),
  };
})();

/* =========================================================
   声（ブラウザに入っている読み上げ機能 speechSynthesis を使う）
   ・人ごとに声の高さ・速さを変える。日本語の声が複数あれば男女で使い分ける
   ・（ ）の中のト書きは読まない
   ========================================================= */
const Voice = (() => {
  const synth = window.speechSynthesis;
  let enabled = true;
  try { enabled = localStorage.getItem('shaki_voice') !== '0'; } catch (e) {}
  const PARAMS = {
    '乃木':   { pitch: 0.9,  rate: 1.0,  g: 'm' },
    'ノコル': { pitch: 0.7,  rate: 0.95, g: 'm' },
    '新庄':   { pitch: 1.0,  rate: 1.08, g: 'm' },
    'チョッキー': { pitch: 1.35, rate: 1.12, g: 'm' },
    '東条':   { pitch: 0.8,  rate: 1.1,  g: 'm' },
    '太田':   { pitch: 1.25, rate: 1.05, g: 'f' },
    'ナレーション': { pitch: 1.0, rate: 0.95, g: 'n' },
  };
  function pickVoice(g) {
    const vs = synth ? synth.getVoices().filter(v => /^ja/i.test(v.lang)) : [];
    if (!vs.length) return null;
    const fem = /kyoko|haruka|nanami|ayumi|sayaka|mizuki|o-ren|female|女性/i;
    const mal = /otoya|ichiro|keita|daichi|hattori|male|男性/i;
    if (g === 'f') return vs.find(v => fem.test(v.name)) || vs[0];
    if (g === 'm') return vs.find(v => mal.test(v.name) && !fem.test(v.name)) || vs[0];
    return vs[0];
  }
  function speak(who, text) {
    if (!enabled || !synth || Sound.isMuted()) return;
    const p = PARAMS[who] || PARAMS['ナレーション'];
    const clean = text.replace(/（[^）]*）/g, '').replace(/…+/g, '、').trim();
    if (!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'ja-JP';
    const v = pickVoice(p.g);
    if (v) u.voice = v;
    u.pitch = p.pitch; u.rate = p.rate; u.volume = 1;
    const prev = current;
    current = u;   // 途中で消されないよう保持しておく
    // 前のせりふを止めてから話す（iPhoneでは止めた直後に話すと無音になることがあるので少し待つ）
    // 最初のせりふは止めずにそのまま話す（タップした直後に話す必要があるため）
    if (prev && (synth.speaking || synth.pending)) {
      synth.cancel();
      setTimeout(() => { if (current === u) { synth.resume(); synth.speak(u); } }, 80);
    } else {
      synth.resume();
      synth.speak(u);
    }
  }
  let current = null;
  // 最初に画面に触れた時、無音のせりふを話しておく（iPhoneで読み上げを使えるようにするため）
  let unlocked = false;
  function unlock() {
    if (unlocked || !synth) return;
    unlocked = true;
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0; u.lang = 'ja-JP';
    synth.speak(u);
  }
  function stop() { if (synth) synth.cancel(); }
  function updateBtn() {
    const b = document.getElementById('voiceBtn');
    if (b) b.classList.toggle('off', !enabled);
  }
  function toggle() {
    enabled = !enabled;
    try { localStorage.setItem('shaki_voice', enabled ? '1' : '0'); } catch (e) {}
    if (!enabled) stop();
    else speak('ナレーション', '声をオンにしました。');
    updateBtn();
  }
  if (synth) synth.getVoices();   // 声の一覧を読み込み始める
  setTimeout(updateBtn, 0);
  return { speak, stop, toggle, unlock, available: !!synth };
})();
