/* =========================================================
   ゲームの状態
   ========================================================= */
let scene = 'title';      // 'title' | 'story' | 'play' | 'clear' | 'over' | 'ending'
let stageIndex = 0;
let stage = null;
let grid = null;          // 当たり判定用のマス目（0:空き 1:障害物 2:壁 3:扉 4:鉄格子）
let bushGrid = null;      // 草むら・わらのマス目
let player = null;
let squad = [];           // 隊員の位置 [{x, y, dir, role}]。0番目が先頭
let guards = [];
let lights = [];          // サーチライト
let lasers = [];          // 赤外線
let bombs = [];           // 爆薬
let booms = [];           // 爆発エフェクト
let items = [];           // 弾薬箱・鍵
let prisoners = [];       // 牢の仲間 { x, y, joined }
let hasKey = false;
let hackTimer = 0;        // ハッキング中の残り時間
let blackoutTimer = 0;    // 停電の残り時間
let blackoutPhase = 0;    // 停電中の会話の進み具合
let chase = null;         // 追っ手の出現管理
let bike = null;          // 敵のバイク
let alertLevel = 0;
let elapsed = 0;
let overReason = '';
let staticLayer = null, bushLayer = null, darkCanvas = null;
let shots = [];
let flashTimer = 0;
let hintText = '', hintTimer = 0;
let shownHints = new Set();
let titleSelect = 0;
let titleButtons = [];
// ストーリー表示
let storyLines = [], storyIdx = 0, storyNext = null, storyTitle = '';

// 遊べるステージ数（クリアすると次が解放。ブラウザに保存）
let unlocked = 1;
try { unlocked = Math.max(1, Math.min(STAGES.length, parseInt(localStorage.getItem('shaki_unlocked'), 10) || 1)); } catch (e) {}
function unlockStage(n) {
  if (n <= unlocked) return;
  unlocked = Math.min(STAGES.length, n);
  try { localStorage.setItem('shaki_unlocked', String(unlocked)); } catch (e) {}
}

/* =========================================================
   入力（キーボード＋タッチ）
   ========================================================= */
const keys = {};
const touchVec = { x: 0, y: 0 };

window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key) || e.code === 'Space') e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  Sound.unlock();
  if (scene === 'title') {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') titleSelect = Math.max(0, titleSelect - 1);
    if (e.code === 'ArrowRight' || e.code === 'ArrowDown') titleSelect = Math.min(unlocked - 1, titleSelect + 1);
  }
  if (scene === 'story' && (e.code === 'KeyS' || e.code === 'Escape')) { skipStory(); return; }
  if (e.code === 'Space' || e.code === 'Enter') onAction();
  if (e.code === 'KeyC' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') toggleCrouch();
  if (e.code === 'KeyH') doHack();
  if (e.code === 'KeyM') Sound.toggleMute();
  if (e.code === 'KeyV') Voice.toggle();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// --- 仮想パッド ---
const pad = document.getElementById('pad');
const knob = document.getElementById('knob');
let padId = null;
function updatePad(e) {
  const r = pad.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const max = r.width / 2;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  if (len < 12) { touchVec.x = 0; touchVec.y = 0; return; }
  touchVec.x = dx / max;
  touchVec.y = dy / max;
}
pad.addEventListener('pointerdown', e => { padId = e.pointerId; pad.setPointerCapture(e.pointerId); updatePad(e); e.preventDefault(); });
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) updatePad(e); });
const padEnd = e => {
  if (e.pointerId !== padId) return;
  padId = null; touchVec.x = 0; touchVec.y = 0; knob.style.transform = '';
};
pad.addEventListener('pointerup', padEnd);
pad.addEventListener('pointercancel', padEnd);

// --- ボタン ---
const actBtn = document.getElementById('actBtn');
actBtn.addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); actBtn.classList.add('on'); onAction(); });
actBtn.addEventListener('pointerup', () => actBtn.classList.remove('on'));
actBtn.addEventListener('pointercancel', () => actBtn.classList.remove('on'));
const crouchBtn = document.getElementById('crouchBtn');
crouchBtn.addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); toggleCrouch(); });
const hackBtn = document.getElementById('hackBtn');
hackBtn.addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); doHack(); });
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); Sound.toggleMute(); });
const voiceBtn = document.getElementById('voiceBtn');
// 声のボタンは指を離した時に反応させる
// （スマホでは「触れた瞬間」は読み上げの許可にならず、「指を離した時」でないと声が出ないため）
voiceBtn.addEventListener('pointerdown', e => e.preventDefault());
voiceBtn.addEventListener('pointerup', e => { e.preventDefault(); Voice.unlock(); Voice.toggle(); });
window.addEventListener('pointerdown', () => Sound.unlock(), true);
// 指を離した時に、音と読み上げを使えるようにする
window.addEventListener('pointerup', () => { Sound.unlock(); Voice.unlock(); }, true);
window.addEventListener('touchend', () => { Sound.unlock(); Voice.unlock(); }, true);
window.addEventListener('keydown', () => Voice.unlock(), true);
// タイトル画面・会話などでは画面タップで進む
canvas.addEventListener('pointerup', e => {
  if (scene === 'play') return;
  if (scene === 'story' && e.clientX < 110 && e.clientY < 60) { skipStory(); return; }
  if (scene === 'title') {
    const b = titleButtons.find(b => e.clientX >= b.x && e.clientX <= b.x + b.w &&
                                     e.clientY >= b.y && e.clientY <= b.y + b.h);
    if (b) { if (b.locked) return; titleSelect = b.index; }
  }
  onAction();
});

function getMoveVec() {
  let x = 0, y = 0;
  if (keys.ArrowLeft || keys.KeyA) x -= 1;
  if (keys.ArrowRight || keys.KeyD) x += 1;
  if (keys.ArrowUp || keys.KeyW) y -= 1;
  if (keys.ArrowDown || keys.KeyS) y += 1;
  x += touchVec.x; y += touchVec.y;
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  return { x, y };
}

/* =========================================================
   画面の流れ（タイトル → 会話 → ステージ → クリア → 会話 → …）
   ========================================================= */
function startStory(title, lines, next) {
  if (!lines || !lines.length) { next(); return; }
  storyTitle = title;
  storyLines = lines; storyIdx = 0; storyNext = next;
  scene = 'story';
  Sound.stopBGM();
  Sound.radio();
  Voice.speak(...lines[0]);
}
function skipStory() { if (scene === 'story') { Voice.stop(); const n = storyNext; storyNext = null; n && n(); } }
// ステージの前の会話 → ステージ開始
function goStage(i) {
  startStory(STAGES[i].name, STAGES[i].story, () => startStage(i));
}

function onAction() {
  if (scene === 'title') { goStage(titleSelect); return; }
  if (scene === 'story') {
    storyIdx++;
    if (storyIdx >= storyLines.length) skipStory();
    else { Sound.radio(); Voice.speak(...storyLines[storyIdx]); }
    return;
  }
  if (scene === 'over')  { startStage(stageIndex); return; }
  if (scene === 'ending') { scene = 'title'; return; }
  if (scene === 'clear') {
    // クリア後の会話 → 次のステージ（最後ならエンディング）
    const i = stageIndex;
    const next = () => {
      if (i + 1 < STAGES.length) goStage(i + 1);
      else startStory('エピローグ', ENDING, () => { scene = 'ending'; Sound.clear(); });
    };
    startStory(STAGES[i].name, STAGES[i].after, next);
    return;
  }
  if (scene !== 'play') return;

  // 麻酔銃：先頭の視界の中にいる見張りを眠らせる
  if (player.cooldown > 0) return;
  if (player.ammo <= 0) { Sound.empty(); player.cooldown = 0.3; return; }
  player.cooldown = SHOT_COOLDOWN;
  player.ammo--;
  const target = findShotTarget();
  if (target) {
    target.state = 'stun';
    target.stunTimer = target.type === 'bike' ? 9999 : STUN_TIME;
    target.susp = 0;
    shots.push({ x1: player.x, y1: player.y, x2: target.x, y2: target.y, t: 0.25 });
    Sound.shot(); setTimeout(() => Sound.hit(), 120);
    if (target.type === 'bike') say('太田：バイク停止！ 本部への連絡は防いだ！');
  } else {
    shots.push({ x1: player.x, y1: player.y,
      x2: player.x + Math.cos(player.dir) * PLAYER_VIEW_RANGE,
      y2: player.y + Math.sin(player.dir) * PLAYER_VIEW_RANGE, t: 0.25 });
    Sound.shot();
  }
}

function toggleCrouch() {
  if (scene !== 'play') return;
  player.crouch = !player.crouch;
  crouchBtn.classList.toggle('on', player.crouch);
  Sound.crouch();
}

// ブルーウォーカーのハッキング：カメラ・サーチライトを一時停止（地下では見張りの位置も見える）
function doHack() {
  if (scene !== 'play' || player.hacks <= 0 || hackTimer > 0) return;
  player.hacks--;
  hackTimer = HACK_TIME;
  Sound.hack();
  say(`太田：監視システムに侵入。${HACK_TIME}秒間、カメラとライトを止める！`);
}

/* =========================================================
   ステージの準備
   ========================================================= */
function startStage(index) {
  stageIndex = index;
  stage = STAGES[index];
  const { cols, rows } = stage;

  grid = []; bushGrid = [];
  for (let y = 0; y < rows; y++) {
    grid.push(new Array(cols).fill(0));
    bushGrid.push(new Array(cols).fill(false));
  }
  const edge = stage.theme === 'desert' ? 1 : 2;
  for (let x = 0; x < cols; x++) { grid[0][x] = edge; grid[rows - 1][x] = edge; }
  for (let y = 0; y < rows; y++) { grid[y][0] = edge; grid[y][cols - 1] = edge; }
  const fill = (rects, v) => (rects || []).forEach(([rx, ry, rw, rh]) => {
    for (let y = ry; y < ry + rh; y++)
      for (let x = rx; x < rx + rw; x++)
        if (grid[y] && x < cols) grid[y][x] = v;
  });
  fill(stage.rocks, 1);
  fill(stage.walls, 2);
  (stage.bushes || []).forEach(([rx, ry, rw, rh]) => {
    for (let y = ry; y < ry + rh; y++)
      for (let x = rx; x < rx + rw; x++) bushGrid[y][x] = true;
  });
  if (stage.map) {
    const code = { '#': 2, 'b': 1, 'D': 3, 'B': 4 };
    stage.map.forEach((row, y) => [...row].forEach((ch, x) => {
      grid[y][x] = code[ch] || 0;
      if (ch === 'w') bushGrid[y][x] = true;
    }));
  }

  player = {
    x: (stage.start[0] + 0.5) * TILE, y: (stage.start[1] + 0.5) * TILE,
    dir: 0, crouch: false, walk: 0,
    cooldown: 0, invuln: 0, stepTimer: 0, heartTimer: 0,
    ammo: stage.ammo, hacks: stage.hacks || 0,
    trail: [],
  };
  shots = []; booms = []; flashTimer = 0;
  hackTimer = 0; blackoutTimer = 0; blackoutPhase = 0;
  hasKey = false;
  crouchBtn.classList.remove('on');

  // 見張り・監視カメラ
  guards = (stage.guards || []).map(makeGuard);

  lights = (stage.searchlights || []).map(l => ({
    ...l, x: l.path[0][0] * TILE, y: l.path[0][1] * TILE, wp: 1, susp: 0, cool: 0,
  }));
  lasers = (stage.lasers || []).map(l => ({ ...l, active: true, ox: 0, oy: 0 }));
  bombs = (stage.bombs || []).map(b => ({ ...b, x: b.at[0] * TILE, y: b.at[1] * TILE, armed: false, done: false }));
  chase = stage.chase ? { ...stage.chase, timer: stage.chase.first, spawned: 0 } : null;
  bike = null;

  items = (stage.ammoItems || []).map(([x, y]) => ({ x: x * TILE, y: y * TILE, taken: false, kind: 'ammo' }));
  if (stage.key) items.push({ x: stage.key[0] * TILE, y: stage.key[1] * TILE, taken: false, kind: 'key' });
  prisoners = (stage.prisoners || []).map(([x, y]) => ({ x: (x + 0.5) * TILE, y: (y + 0.5) * TILE, joined: false }));

  initTrail();
  updateSquad();

  alertLevel = 0;
  elapsed = 0;
  hintText = stage.intro; hintTimer = 4;
  shownHints = new Set();
  buildLayers();
  resize();
  scene = 'play';
  document.body.classList.toggle('nohack', !(stage.hacks > 0));
  Sound.start();
  Sound.startBGM(stage.music);
}

function makeGuard(g) {
  const p = g.pos || g.waypoints[0];
  return {
    ...g,
    x: p[0] * TILE, y: p[1] * TILE,
    homeX: p[0] * TILE, homeY: p[1] * TILE,
    dir: g.center !== undefined ? g.center : 0,
    wp: 1, wpStep: 1, wait: 0,
    state: 'patrol',     // 'patrol' | 'alert' | 'search' | 'return' | 'stun'
    susp: 0, seen: false,
    lastX: 0, lastY: 0,
    lostTimer: 0, searchTimer: 0, stunTimer: 0, pause: 0, cool: 0,
    phase: Math.random() * 6,
  };
}

/* =========================================================
   当たり判定まわり
   ========================================================= */
// その座標が視線をさえぎるか（鉄格子 4 は通れないが、視線は通る）
function solidAt(px, py) {
  const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (ty < 0 || ty >= stage.rows || tx < 0 || tx >= stage.cols) return true;
  return grid[ty][tx] !== 0 && grid[ty][tx] !== 4;
}
function circleHitsWall(x, y, r) {
  const x0 = Math.floor((x - r) / TILE), x1 = Math.floor((x + r) / TILE);
  const y0 = Math.floor((y - r) / TILE), y1 = Math.floor((y + r) / TILE);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (ty < 0 || ty >= stage.rows || tx < 0 || tx >= stage.cols) return true;
      if (grid[ty][tx] === 0) continue;
      const cx = Math.max(tx * TILE, Math.min(x, (tx + 1) * TILE));
      const cy = Math.max(ty * TILE, Math.min(y, (ty + 1) * TILE));
      if ((x - cx) ** 2 + (y - cy) ** 2 < r * r) return true;
    }
  }
  return false;
}
function moveWithCollision(obj, dx, dy, r) {
  if (!circleHitsWall(obj.x + dx, obj.y, r)) obj.x += dx;
  if (!circleHitsWall(obj.x, obj.y + dy, r)) obj.y += dy;
}
function lineOfSight(x1, y1, x2, y2) {
  const d = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.ceil(d / 6);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (solidAt(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)) return false;
  }
  return true;
}
function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function turnToward(g, target, speed, dt) {
  const d = angleDiff(target, g.dir);
  const step = speed * dt;
  g.dir += Math.abs(d) < step ? d : Math.sign(d) * step;
}
function inBush(x, y) {
  const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
  return !!(bushGrid[ty] && bushGrid[ty][tx]);
}
function hidden(m) { return player.crouch && inBush(m.x, m.y); }
// 点と線分の距離
function distToSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

/* =========================================================
   部隊（一列で進む）
   ・先頭が通った道すじ trail を記録し、後ろの隊員はそれを一定間隔でたどる
   ========================================================= */
function squadCount() { return stage.team.length + prisoners.filter(p => p.joined).length; }
function memberRole(i) { return stage.team[i] || 'rescued'; }

// 最初から一列に並ぶよう、後ろ側（左）へ道すじを作る。壁に当たったら曲げる
function initTrail() {
  const t = player.trail = [];
  const dirs = [[-1, 0], [0, 1], [0, -1], [1, 0]];
  let x = player.x, y = player.y, di = 0;
  const need = SQUAD_GAP * stage.team.length + 40;
  for (let len = 0; len < need; len += 3) {
    let tries = 0;
    while (tries < 4 && circleHitsWall(x + dirs[di][0] * 3, y + dirs[di][1] * 3, MEMBER_R)) { di = (di + 1) % 4; tries++; }
    if (tries >= 4) break;
    x += dirs[di][0] * 3; y += dirs[di][1] * 3;
    t.push({ x, y });
  }
}
function recordTrail() {
  const t = player.trail;
  const last = t[0];
  if (!last || Math.hypot(player.x - last.x, player.y - last.y) >= 3) {
    t.unshift({ x: player.x, y: player.y });
    const need = SQUAD_GAP * (squadCount() + 1) + 40;
    let d = 0;
    for (let i = 1; i < t.length; i++) {
      d += Math.hypot(t[i].x - t[i - 1].x, t[i].y - t[i - 1].y);
      if (d > need) { t.length = i + 1; break; }
    }
  }
}
function updateSquad() {
  const t = player.trail;
  squad = [{ x: player.x, y: player.y, dir: player.dir, role: memberRole(0), leader: true }];
  let want = SQUAD_GAP, acc = 0, prev = { x: player.x, y: player.y }, i = 0;
  const count = squadCount();
  while (squad.length < count) {
    const p = t[i];
    if (!p) { squad.push({ x: prev.x, y: prev.y, dir: player.dir, role: memberRole(squad.length) }); continue; }
    const seg = Math.hypot(p.x - prev.x, p.y - prev.y);
    if (acc + seg >= want && seg > 0) {
      const k = (want - acc) / seg;
      const x = prev.x + (p.x - prev.x) * k, y = prev.y + (p.y - prev.y) * k;
      squad.push({ x, y, dir: Math.atan2(prev.y - p.y, prev.x - p.x), role: memberRole(squad.length) });
      prev = { x, y }; acc = 0; want = SQUAD_GAP;
    } else {
      acc += seg; prev = p; i++;
    }
  }
}

/* =========================================================
   見張り・カメラがプレイヤーを見ているか
   ========================================================= */
function guardCanSee(g) {
  if (g.state === 'stun' || g.type === 'bike' || g.type === 'chaser') return null;
  if (g.type === 'camera' && hackTimer > 0) return null;
  let best = null, bestD = Infinity;
  for (const m of squad) {
    const d = Math.hypot(m.x - g.x, m.y - g.y);
    if (d < bestD && guardCanSeeMember(g, m)) { best = m; bestD = d; }
  }
  return best;
}
function viewRange(g) {
  let r = g.type === 'camera' ? CAMERA_RANGE : VIEW_RANGE;
  if (g.state === 'alert') r *= 1.2;
  if (blackoutTimer > 0 && g.type !== 'camera') r *= 0.5;   // 停電中は見えにくい
  return r;
}
function guardCanSeeMember(g, m) {
  const dx = m.x - g.x, dy = m.y - g.y;
  const dist = Math.hypot(dx, dy);
  let range = viewRange(g) * (player.crouch && g.state !== 'alert' ? CROUCH_RANGE_RATE : 1);
  if (hidden(m) && g.state !== 'alert') range = 45;
  if (dist > range) return false;
  if (dist > 30 && Math.abs(angleDiff(Math.atan2(dy, dx), g.dir)) > VIEW_ANGLE / 2) return false;
  return lineOfSight(g.x, g.y, m.x, m.y);
}
// 先頭の視界の中にいる見張り（麻酔銃で狙える相手）。カメラは狙えない
function findShotTarget() {
  let best = null, bestD = Infinity;
  for (const g of guards) {
    if (g.state === 'stun' || g.type === 'camera') continue;
    const dx = g.x - player.x, dy = g.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > PLAYER_VIEW_RANGE || d >= bestD) continue;
    if (d > 35 && Math.abs(angleDiff(Math.atan2(dy, dx), player.dir)) > PLAYER_VIEW_ANGLE / 2) continue;
    if (!lineOfSight(player.x, player.y, g.x, g.y)) continue;
    best = g; bestD = d;
  }
  return best;
}
// 部隊のうち、その地点に一番近い隊員
function nearestMember(x, y) {
  let best = squad[0], bd = Infinity;
  for (const m of squad) { const d = Math.hypot(m.x - x, m.y - y); if (d < bd) { bd = d; best = m; } }
  return best;
}
// 警報：近くの見張りを一斉にその地点へ向かわせる
function raiseAlarm(x, y) {
  alertLevel = Math.min(100, alertLevel + 20);
  Sound.siren();
  for (const g of guards) {
    if (g.state === 'stun' || g.type === 'camera' || g.type === 'bike') continue;
    if (Math.hypot(g.x - x, g.y - y) > 500) continue;
    g.state = 'alert'; g.susp = 1; g.lostTimer = 0;
    g.lastX = x; g.lastY = y;
  }
}

/* =========================================================
   更新処理
   ========================================================= */
function update(dt) {
  if (scene !== 'play') return;
  elapsed += dt;
  if (hintTimer > 0) hintTimer -= dt;
  if (player.cooldown > 0) player.cooldown -= dt;
  if (player.invuln > 0) player.invuln -= dt;
  if (flashTimer > 0) flashTimer -= dt;
  if (hackTimer > 0) { hackTimer -= dt; if (hackTimer <= 0) say('太田：システムが復旧する。カメラが戻るよ！'); }
  shots.forEach(s => s.t -= dt); shots = shots.filter(s => s.t > 0);
  booms.forEach(b => b.t -= dt); booms = booms.filter(b => b.t > 0);
  hackBtn.classList.toggle('off', player.hacks <= 0 || hackTimer > 0);
  updateBlackout(dt);

  // --- 先頭の移動 ---
  const mv = getMoveVec();
  const speed = player.crouch ? CROUCH_SPEED : PLAYER_SPEED;
  if (mv.x || mv.y) {
    player.dir = Math.atan2(mv.y, mv.x);
    player.walk += dt * (player.crouch ? 6 : 12);
    moveWithCollision(player, mv.x * speed * dt, mv.y * speed * dt, PLAYER_R);
    recordTrail();
    player.stepTimer -= dt;
    if (player.stepTimer <= 0) { Sound.step(player.crouch); player.stepTimer = player.crouch ? 0.55 : 0.3; }
  }
  updateSquad();

  // --- ヒント：新しいエリアに入った時に1回だけ表示 ---
  const tx = player.x / TILE, ty = player.y / TILE;
  const h = (stage.hints || []).find(h => tx >= h.area[0] && tx < h.area[0] + h.area[2] &&
                                          ty >= h.area[1] && ty < h.area[1] + h.area[3]);
  if (h && !shownHints.has(h) && hintTimer <= 0.3) {
    shownHints.add(h); hintText = h.text; hintTimer = 5;
    const m = h.text.match(/^(乃木|ノコル|新庄|チョッキー|東条|太田)：(.+)$/);
    if (m) Voice.speak(m[1], m[2]);
  }

  // --- 弾薬箱・鍵 ---
  for (const it of items) {
    if (!it.taken && Math.hypot(player.x - it.x, player.y - it.y) < 24) {
      it.taken = true;
      Sound.pickup();
      if (it.kind === 'key') {
        hasKey = true;
        if (stage.blackout) { blackoutTimer = stage.blackout; blackoutPhase = 0; Sound.powerDown(); say('東条：停電だ！ 通信が……ザザッ……切れる……'); }
        else say('牢の鍵を手に入れた！');
      } else player.ammo += AMMO_PICKUP;
    }
  }

  // --- 牢の扉：鍵を持って近づくと開く ---
  for (let y = 0; y < stage.rows; y++) {
    for (let x = 0; x < stage.cols; x++) {
      if (grid[y][x] !== 3) continue;
      if (Math.hypot(player.x - (x + 0.5) * TILE, player.y - (y + 0.5) * TILE) >= TILE) continue;
      if (hasKey) { grid[y][x] = 0; buildLayers(); Sound.door(); say('扉が開いた。仲間に近づいて連れ出せ。'); }
      else if (hintTimer <= 0) say('扉には鍵がかかっている。鍵は看守部屋にある。');
    }
  }

  // --- 牢の仲間：先頭が近づくと列の最後尾に加わる ---
  for (const p of prisoners) {
    if (!p.joined && Math.hypot(player.x - p.x, player.y - p.y) < 34) {
      p.joined = true;
      Sound.rescue();
      const n = prisoners.filter(q => q.joined).length;
      say(n < prisoners.length ? `仲間を確保（${n}/${prisoners.length}）` : '乃木：4人を確保した。全員で左上の階段まで戻るぞ。');
    }
  }

  // --- 追っ手とバイク（脱出ステージ） ---
  updateChase(dt);

  // --- 見張り ---
  let anyAlert = false;
  for (const g of guards) {
    updateGuard(g, dt);
    if (g.state === 'alert') anyAlert = true;
    const caught = g.state === 'alert' && player.invuln <= 0 &&
      squad.find((m, i) => Math.hypot(m.x - g.x, m.y - g.y) < (i ? MEMBER_R : PLAYER_R) + GUARD_R);
    if (caught) {
      alertLevel = Math.min(100, alertLevel + CAUGHT_PENALTY);
      player.invuln = 1.5;
      g.pause = 1.2;
      flashTimer = 0.4;
      if (caught.leader) {
        const a = Math.atan2(player.y - g.y, player.x - g.x);
        moveWithCollision(player, Math.cos(a) * 40, Math.sin(a) * 40, PLAYER_R);
        recordTrail();
      }
      Sound.caught();
    }
  }

  for (const l of lights) updateLight(l, dt);
  updateLasers();
  updateBombs();

  // --- 心臓の鼓動：見張りが近い・怪しまれているほど速く大きく ---
  let danger = 0;
  for (const g of guards) {
    if (g.state === 'stun' || g.type === 'camera') continue;
    let near = Infinity;
    for (const m of squad) near = Math.min(near, Math.hypot(m.x - g.x, m.y - g.y));
    danger = Math.max(danger, 1 - near / 260, g.susp, g.state === 'alert' ? 1 : 0);
  }
  for (const l of lights) danger = Math.max(danger, l.susp);
  for (const l of lasers) if (l.active) {
    const d = distToSeg(player.x, player.y, (l.a[0]) * TILE + l.ox, l.a[1] * TILE + l.oy, l.b[0] * TILE + l.ox, l.b[1] * TILE + l.oy);
    danger = Math.max(danger, 1 - d / 120);
  }
  player.heartTimer -= dt;
  if (danger > 0 && player.heartTimer <= 0) { Sound.heart(danger); player.heartTimer = 1.1 - 0.65 * danger; }

  Sound.setTension(anyAlert);

  if (!anyAlert) alertLevel = Math.max(0, alertLevel - ALERT_DECAY * dt);
  if (alertLevel >= 100) { gameOver(stage.chase ? '追っ手に包囲された！' : '警戒度が最大になった！'); return; }

  // --- ゴール判定 ---
  const [gx, gy, gw, gh] = stage.goal;
  const goalOpen = !stage.needRescue || prisoners.every(p => p.joined);
  if (goalOpen && player.x > gx * TILE && player.x < (gx + gw) * TILE &&
      player.y > gy * TILE && player.y < (gy + gh) * TILE) {
    scene = 'clear';
    unlockStage(stageIndex + 2);
    Sound.stopBGM();
    Sound.clear();
  }
}

// 停電：鍵を取ると起きる。時間がたつと復旧
function updateBlackout(dt) {
  if (blackoutTimer <= 0) return;
  blackoutTimer -= dt;
  if (blackoutPhase === 0 && blackoutTimer < stage.blackout - 4) {
    blackoutPhase = 1;
    say('太田：（敵の無線を聞き取って）……アゼルバイジャン語で「予備電源に切り替える」って。もうすぐ明かりが戻る！');
  }
  if (blackoutTimer <= 0) { Sound.powerUp(); say('太田：電源が戻った！ 見張りの目も戻るよ、気をつけて！'); }
}

// サーチライト
function updateLight(l, dt) {
  const p = l.path[l.wp];
  const tx = p[0] * TILE, ty = p[1] * TILE;
  const dx = tx - l.x, dy = ty - l.y, d = Math.hypot(dx, dy);
  const step = l.speed * dt;
  if (d <= step) { l.x = tx; l.y = ty; l.wp = l.path.length > 2 ? (l.wp + 1) % l.path.length : 1 - l.wp; }
  else { l.x += dx / d * step; l.y += dy / d * step; }

  if (l.cool > 0) { l.cool -= dt; return; }
  const lit = hackTimer <= 0 && squad.find(m => Math.hypot(m.x - l.x, m.y - l.y) < l.r && !hidden(m));
  if (lit) {
    if (l.susp === 0) Sound.suspect();
    l.susp += dt * 1.4;
    if (l.susp >= 1) { l.susp = 0; l.cool = 4; raiseAlarm(lit.x, lit.y); }
  } else {
    l.susp = Math.max(0, l.susp - dt * 0.8);
  }
}

// 赤外線：点滅・移動させ、隊員が触れたら警報
function updateLasers() {
  for (const l of lasers) {
    const t = elapsed + (l.phase || 0);
    l.active = l.type !== 'blink' || (t % l.period) < l.on;
    // 点滅する線：切り替わる0.5秒前から予告（warn）
    if (l.type === 'blink') {
      const ph = t % l.period;
      l.warn = l.active ? ph > l.on - 0.5 : ph > l.period - 0.5;
    }
    if (l.type === 'move') {
      const s = Math.sin(t * l.speed);
      l.ox = l.move[0] * TILE * s; l.oy = l.move[1] * TILE * s;
    }
    if (!l.active || player.invuln > 0) continue;
    if (l.high && player.crouch) continue;      // 高い位置の線は、ほふくでくぐれる
    const ax = l.a[0] * TILE + l.ox, ay = l.a[1] * TILE + l.oy, bx = l.b[0] * TILE + l.ox, by = l.b[1] * TILE + l.oy;
    if (squad.some(m => distToSeg(m.x, m.y, ax, ay, bx, by) < 8)) {
      alertLevel = Math.min(100, alertLevel + (stage.laserPenalty || LASER_PENALTY));
      player.invuln = 1.5; flashTimer = 0.4;
      Sound.laser();
      say('赤外線に触れた！ 警報が鳴っている！');
    }
  }
}

// 爆薬：部隊が通り過ぎると作動。追っ手が近づくと起爆
function updateBombs() {
  for (const b of bombs) {
    if (b.done) continue;
    if (!b.armed && player.x > b.x + TILE) { b.armed = true; say(`東条：${b.label}地点、起爆準備よし。`); }
    if (!b.armed) continue;
    const near = guards.some(g => g.type === 'chaser' && g.state !== 'stun' && Math.hypot(g.x - b.x, g.y - b.y) < 70);
    if (!near) continue;
    b.done = true;
    if (b.kind === 'dud') { Sound.dud(); say(`東条：${b.label}地点……不発だ！ くそっ！`); continue; }
    const r = b.kind === 'big' ? 150 : 55;
    booms.push({ x: b.x, y: b.y, r, t: 0.8 });
    Sound.boom();
    for (const g of guards) {
      if (g.type === 'chaser' && Math.hypot(g.x - b.x, g.y - b.y) < r) { g.state = 'stun'; g.stunTimer = 25; }
    }
    say(b.kind === 'big' ? `東条：${b.label}地点、命中！ 追っ手を止めた！` : `東条：${b.label}地点、起爆！……一台取り逃がした！`);
  }
}

// 追っ手の道案内：部隊のいるマスからの距離を全マスに書き込む（幅優先探索）
// 追っ手は、距離が小さくなる隣のマスへ進むことで岩を回り込める
let flow = null, flowTimer = 0;
function buildFlow() {
  const { cols, rows } = stage;
  flow = new Int16Array(cols * rows).fill(-1);
  const q = [];
  for (const m of squad) {
    const k = Math.floor(m.y / TILE) * cols + Math.floor(m.x / TILE);
    if (flow[k] === -1) { flow[k] = 0; q.push(k); }
  }
  for (let h = 0; h < q.length; h++) {
    const k = q[h], x = k % cols, y = (k - x) / cols;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows || grid[ny][nx] !== 0) continue;
      const nk = ny * cols + nx;
      if (flow[nk] === -1) { flow[nk] = flow[k] + 1; q.push(nk); }
    }
  }
}
// 追っ手が次に向かう地点
function chaseTarget(g) {
  const cols = stage.cols;
  const tx = Math.floor(g.x / TILE), ty = Math.floor(g.y / TILE);
  const here = flow ? flow[ty * cols + tx] : -1;
  if (here <= 1) { const m = nearestMember(g.x, g.y); return [m.x, m.y]; }
  let best = null, bd = here;
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    const v = flow[(ty + dy) * cols + tx + dx];
    if (v >= 0 && v < bd) { bd = v; best = [(tx + dx + 0.5) * TILE, (ty + dy + 0.5) * TILE]; }
  }
  if (!best) { const m = nearestMember(g.x, g.y); return [m.x, m.y]; }
  return best;
}

// 追っ手の出現とバイク
function updateChase(dt) {
  if (chase) {
    flowTimer -= dt;
    if (flowTimer <= 0) { buildFlow(); flowTimer = 0.3; }
    chase.timer -= dt;
    const alive = guards.filter(g => g.type === 'chaser' && g.state !== 'stun').length;
    if (chase.timer <= 0 && alive < chase.max && chase.spawned < chase.total) {
      chase.timer = chase.every;
      chase.spawned++;
      // 先頭より少し前（8マス以内）までの出現場所から選ぶ（城門からは必ず候補）
      const px = player.x / TILE;
      const cand = chase.spawns.filter(([x], i) => i === 0 || (x < px + 8 && x > px - 14));
      const sp = cand[Math.floor(Math.random() * cand.length)];
      const g = makeGuard({ type: 'chaser', pos: sp });
      g.state = 'alert';
      guards.push(g);
    }
  }
  if (stage.bike && !bike && elapsed > stage.bike.at) {
    bike = makeGuard({ type: 'bike', waypoints: stage.bike.path });
    bike.speed = stage.bike.speed;
    guards.push(bike);
    say('太田：敵のバイクが通信可能エリアに向かってる！ 止めて！');
  }
}

function updateGuard(g, dt) {
  const PATROL_SPEED = 55;

  if (g.state === 'stun') {
    g.stunTimer -= dt;
    if (g.stunTimer <= 0) g.state = g.type === 'chaser' ? 'alert' : 'return';
    g.seen = false;
    return;
  }

  // --- 敵のバイク：ルートを走り、終点（通信可能エリア）に着くと本部に知られる ---
  if (g.type === 'bike') {
    if (g.done) return;
    const p = g.waypoints[g.wp];
    if (moveGuardTo(g, p[0] * TILE, p[1] * TILE, g.speed, dt)) {
      g.wp++;
      if (g.wp >= g.waypoints.length) {
        g.done = true;
        alertLevel = Math.min(100, alertLevel + 25);
        if (chase) { chase.every *= 0.6; chase.max += 2; chase.total += 4; }
        Sound.siren();
        say('太田：バイクが通信エリアに入った……本部に救出作戦が伝わった！ 追っ手が増える！');
      }
    }
    return;
  }

  // --- 追っ手：常に部隊の位置を知っていて、追いかけてくる ---
  if (g.type === 'chaser') {
    if (g.pause > 0) { g.pause -= dt; return; }
    const [tx, ty] = chaseTarget(g);
    moveGuardTo(g, tx, ty, chase ? chase.speed : CHASE_SPEED, dt);
    return;
  }

  // --- 監視カメラ：首を振り、見つけたら警報（ハッキング中は停止） ---
  if (g.type === 'camera') {
    if (hackTimer > 0) { g.susp = 0; g.seen = false; return; }
    if (g.cool > 0) g.cool -= dt;
    g.phase += dt * 0.7;
    turnToward(g, g.center + Math.sin(g.phase) * g.amp, 2, dt);
    const m = g.cool > 0 ? null : guardCanSee(g);
    g.seen = !!m;
    if (m) {
      if (g.susp < 0.05) Sound.suspect();
      g.susp += dt * 1.2;
      if (g.susp >= 1) { g.susp = 0; g.cool = 4; raiseAlarm(m.x, m.y); }
    } else g.susp = Math.max(0, g.susp - dt * 0.5);
    return;
  }

  const seenM = guardCanSee(g);
  g.seen = !!seenM;
  if (seenM) { g.lastX = seenM.x; g.lastY = seenM.y; }

  if (g.state === 'alert') {
    if (g.pause > 0) { g.pause -= dt; return; }
    if (g.seen) {
      g.lostTimer = 0;
      alertLevel = Math.min(100, alertLevel + ALERT_PER_SEC * dt);
    } else {
      g.lostTimer += dt;
      if (g.lostTimer > 3) { g.state = 'search'; g.searchTimer = 3; g.susp = 0.2; }
    }
    moveGuardTo(g, g.lastX, g.lastY, CHASE_SPEED, dt);
    return;
  }

  if (g.seen) {
    const dist = Math.hypot(seenM.x - g.x, seenM.y - g.y);
    const before = g.susp;
    g.susp += dt * (SUSPECT_BASE + SUSPECT_NEAR * Math.max(0, 1 - dist / VIEW_RANGE));
    if (before < 0.05 && g.susp >= 0.05) Sound.suspect();
    if (g.susp >= 1) {
      g.susp = 1; g.state = 'alert'; g.lostTimer = 0;
      alertLevel = Math.min(100, alertLevel + 20);
      Sound.alert();
      return;
    }
  } else {
    g.susp = Math.max(0, g.susp - dt * 0.35);
  }

  if (g.susp > 0.25) { turnToward(g, Math.atan2(g.lastY - g.y, g.lastX - g.x), 3, dt); return; }

  if (g.state === 'search') {
    if (moveGuardTo(g, g.lastX, g.lastY, PATROL_SPEED * 1.4, dt)) {
      g.dir += dt * 2.5;
      g.searchTimer -= dt;
      if (g.searchTimer <= 0) g.state = 'return';
    }
    return;
  }
  if (g.state === 'return') {
    let tx = g.homeX, ty = g.homeY;
    if (g.type === 'patrol') { const p = g.waypoints[g.wp]; tx = p[0] * TILE; ty = p[1] * TILE; }
    if (moveGuardTo(g, tx, ty, PATROL_SPEED * 1.2, dt)) g.state = 'patrol';
    return;
  }
  if (g.type === 'turn') {
    g.phase += dt * 0.8;
    turnToward(g, g.center + Math.sin(g.phase) * g.amp, 2, dt);
    return;
  }
  if (g.wait > 0) { g.wait -= dt; return; }
  const p = g.waypoints[g.wp];
  if (moveGuardTo(g, p[0] * TILE, p[1] * TILE, PATROL_SPEED, dt)) {
    g.wait = 1.2;
    if (g.loop) g.wp = (g.wp + 1) % g.waypoints.length;
    else {
      if (g.wp + g.wpStep >= g.waypoints.length || g.wp + g.wpStep < 0) g.wpStep *= -1;
      g.wp += g.wpStep;
    }
  }
}

function moveGuardTo(g, tx, ty, speed, dt) {
  const dx = tx - g.x, dy = ty - g.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 4) return true;
  const ang = Math.atan2(dy, dx);
  turnToward(g, ang, 5, dt);
  const step = Math.min(dist, speed * dt);
  moveWithCollision(g, Math.cos(ang) * step, Math.sin(ang) * step, GUARD_R);
  return false;
}

// 無線・ヒントをすぐに表示する
// 「名前：せりふ」の形なら、その人の声で読み上げる
function say(text) {
  hintText = text; hintTimer = 4.5; Sound.radio();
  const m = text.match(/^(乃木|ノコル|新庄|チョッキー|東条|太田)：(.+)$/);
  if (m) Voice.speak(m[1], m[2]);
}

function gameOver(reason) {
  overReason = reason;
  scene = 'over';
  Sound.stopBGM();
  Sound.gameOver();
}

/* =========================================================
   描画
   ========================================================= */
let viewW = 800, viewH = 450, zoom = 1, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  zoom = Math.max(0.55, Math.min(window.innerWidth / 760, window.innerHeight / 480));
  if (stage) zoom = Math.max(zoom, window.innerWidth / (stage.cols * TILE), window.innerHeight / (stage.rows * TILE));
  viewW = window.innerWidth / zoom;
  viewH = window.innerHeight / zoom;
}
window.addEventListener('resize', resize);
resize();

function seededRandom(seed) {
  return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
}

// 地面・障害物・壁・草むらを事前に描いておく
function buildLayers() {
  const W = stage.cols * TILE, H = stage.rows * TILE;
  const rnd = seededRandom(12345 + stageIndex);
  const th = stage.theme;

  staticLayer = document.createElement('canvas');
  staticLayer.width = W; staticLayer.height = H;
  const c = staticLayer.getContext('2d');

  if (th === 'desert') {
    c.fillStyle = '#b89a6a';
    c.fillRect(0, 0, W, H);
    for (let i = 0; i < W * H / 640; i++) {
      c.fillStyle = rnd() < 0.5 ? 'rgba(90,60,30,0.15)' : 'rgba(255,240,200,0.15)';
      const s = 1 + rnd() * 3;
      c.fillRect(rnd() * W, rnd() * H, s, s);
    }
    // 轍（わだち）っぽい道
    const [gx, gy, , gh] = stage.goal;
    c.strokeStyle = 'rgba(120,90,50,0.25)';
    c.lineWidth = 18;
    c.beginPath(); c.moveTo(0, (stage.start[1] + 0.5) * TILE);
    c.bezierCurveTo(W * 0.25, H * 0.36, W * 0.62, H * 0.64, gx * TILE, (gy + gh / 2) * TILE);
    c.stroke();
  } else {
    // 石畳（中庭は明るく、地下・研究区画は暗く）
    const base = th === 'courtyard' ? [143, 133, 116] : th === 'lab' ? [52, 58, 66] : [62, 58, 52];
    c.fillStyle = `rgb(${base})`;
    c.fillRect(0, 0, W, H);
    for (let y = 0; y < stage.rows * 2; y++) {
      for (let x = 0; x < stage.cols * 2; x++) {
        const v = Math.floor(rnd() * (th === 'courtyard' ? 20 : 14)) - 7;
        c.fillStyle = `rgb(${base[0] + v},${base[1] + v},${base[2] + v})`;
        c.fillRect(x * 20 + 1, y * 20 + 1, 18, 18);
      }
    }
    if (th === 'dungeon') {
      const [gx, gy, gw, gh] = stage.goal;
      for (let i = 0; i < 6; i++) {
        c.fillStyle = `rgb(${90 - i * 10},${85 - i * 10},${80 - i * 10})`;
        c.fillRect(gx * TILE, gy * TILE + i * gh * TILE / 6, gw * TILE, gh * TILE / 6 - 2);
      }
    }
  }

  (stage.floors || []).forEach(f => {
    const [x, y, w, h] = f.rect;
    c.fillStyle = f.color;
    c.fillRect(x * TILE, y * TILE, w * TILE, h * TILE);
  });

  const wallColor = th === 'dungeon' ? ['#4b4750', '#2f2c33'] : th === 'lab' ? ['#454b55', '#2c3038'] : ['#7d7d86', '#5a5a63'];
  for (let y = 0; y < stage.rows; y++) {
    for (let x = 0; x < stage.cols; x++) {
      const px = x * TILE, py = y * TILE, v = grid[y][x];
      if (v === 1 && th === 'desert') {
        c.fillStyle = '#6b5a48';
        c.fillRect(px, py, TILE, TILE);
        c.fillStyle = '#857057';
        c.beginPath();
        c.moveTo(px + 4 + rnd() * 6, py + 6 + rnd() * 6);
        c.lineTo(px + TILE - 6 - rnd() * 6, py + 4 + rnd() * 6);
        c.lineTo(px + TILE - 4 - rnd() * 6, py + TILE - 8 - rnd() * 6);
        c.lineTo(px + 6 + rnd() * 6, py + TILE - 6 - rnd() * 6);
        c.closePath(); c.fill();
        c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 1;
        c.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
      } else if (v === 1) {
        // 木箱・柱
        c.fillStyle = '#8a5a2b';
        c.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
        c.strokeStyle = '#5a3a1a'; c.lineWidth = 3;
        c.strokeRect(px + 3.5, py + 3.5, TILE - 7, TILE - 7);
        c.beginPath();
        c.moveTo(px + 4, py + 4); c.lineTo(px + TILE - 4, py + TILE - 4);
        c.moveTo(px + TILE - 4, py + 4); c.lineTo(px + 4, py + TILE - 4);
        c.stroke();
      } else if (v === 4) {
        // 鉄格子
        c.fillStyle = '#2a2a2a';
        c.fillRect(px, py + TILE / 2 - 3, TILE, 6);
        c.fillStyle = '#777';
        for (let i = 4; i < TILE; i += 9) c.fillRect(px + i, py + 4, 3, TILE - 8);
      } else if (v === 3) {
        // 牢の扉（鍵穴付き）
        c.fillStyle = '#5a3a1a';
        c.fillRect(px + 2, py + 6, TILE - 4, TILE - 12);
        c.fillStyle = '#999';
        for (let i = 6; i < TILE - 4; i += 8) c.fillRect(px + i, py + 6, 2, TILE - 12);
        c.fillStyle = '#ffd54f';
        c.fillRect(px + TILE / 2 - 3, py + TILE / 2 - 4, 6, 8);
      } else if (v === 2) {
        // 壁（レンガ模様）
        c.fillStyle = wallColor[0];
        c.fillRect(px, py, TILE, TILE);
        c.strokeStyle = wallColor[1]; c.lineWidth = 2;
        for (let r = 0; r < 4; r++) {
          const yy = py + r * 10;
          c.beginPath(); c.moveTo(px, yy); c.lineTo(px + TILE, yy); c.stroke();
          const off = (r % 2) * 10;
          for (let xx = px + off; xx < px + TILE; xx += 20) {
            c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx, yy + 10); c.stroke();
          }
        }
      }
    }
  }

  c.font = 'bold 16px sans-serif'; c.textAlign = 'center';
  (stage.labels || []).forEach(l => {
    c.fillStyle = 'rgba(0,0,0,0.5)';
    const w = c.measureText(l.text).width + 12;
    c.fillRect(l.x * TILE - w / 2, l.y * TILE - 16, w, 22);
    c.fillStyle = '#eee';
    c.fillText(l.text, l.x * TILE, l.y * TILE);
  });

  bushLayer = document.createElement('canvas');
  bushLayer.width = W; bushLayer.height = H;
  const b = bushLayer.getContext('2d');
  const straw = th === 'dungeon';
  for (let y = 0; y < stage.rows; y++) {
    for (let x = 0; x < stage.cols; x++) {
      if (!bushGrid[y][x]) continue;
      for (let i = 0; i < 6; i++) {
        b.fillStyle = straw ? ['#a8873a', '#c09a45', '#8c6f2c'][i % 3] : ['#4f6b2e', '#5f7d36', '#3f5a24'][i % 3];
        b.beginPath();
        b.arc(x * TILE + 6 + rnd() * 28, y * TILE + 6 + rnd() * 28, 9 + rnd() * 7, 0, Math.PI * 2);
        b.fill();
      }
    }
  }
}

// 見張り・カメラの視界（扇形）
function drawVision(g) {
  if (g.state === 'stun' || g.type === 'bike' || g.type === 'chaser') return;
  if (g.type === 'camera' && hackTimer > 0) return;
  const range = viewRange(g);
  const RAYS = 28;
  ctx.beginPath();
  ctx.moveTo(g.x, g.y);
  for (let i = 0; i <= RAYS; i++) {
    const a = g.dir - VIEW_ANGLE / 2 + VIEW_ANGLE * i / RAYS;
    const cos = Math.cos(a), sin = Math.sin(a);
    let d = 0;
    while (d < range) { if (solidAt(g.x + cos * d, g.y + sin * d)) break; d += 6; }
    ctx.lineTo(g.x + cos * d, g.y + sin * d);
  }
  ctx.closePath();
  if (g.type === 'camera') ctx.fillStyle = g.susp > 0.05 ? 'rgba(255,90,90,0.35)' : 'rgba(90,220,255,0.22)';
  else if (g.state === 'alert') ctx.fillStyle = 'rgba(255,40,40,0.30)';
  else if (g.susp > 0.25 || g.state === 'search') ctx.fillStyle = 'rgba(255,150,0,0.30)';
  else ctx.fillStyle = 'rgba(255,240,80,0.22)';
  ctx.fill();
}

function drawLight(l) {
  const off = hackTimer > 0;
  const grad = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
  const red = l.susp > 0;
  grad.addColorStop(0, off ? 'rgba(120,120,140,0.25)' : red ? 'rgba(255,200,180,0.65)' : 'rgba(255,255,230,0.55)');
  grad.addColorStop(0.8, off ? 'rgba(120,120,140,0.12)' : red ? 'rgba(255,160,140,0.35)' : 'rgba(255,255,220,0.30)');
  grad.addColorStop(1, 'rgba(255,255,220,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2); ctx.fill();
  if (l.susp > 0) {
    ctx.strokeStyle = '#ff5030'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(l.x, l.y, l.r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * l.susp); ctx.stroke();
  }
}

// 赤外線
function drawLasers() {
  for (const l of lasers) {
    const ax = l.a[0] * TILE + l.ox, ay = l.a[1] * TILE + l.oy, bx = l.b[0] * TILE + l.ox, by = l.b[1] * TILE + l.oy;
    // 発射装置
    ctx.fillStyle = '#222';
    ctx.fillRect(ax - 5, ay - 5, 10, 10); ctx.fillRect(bx - 5, by - 5, 10, 10);
    const col = l.high ? '255,160,0' : '255,40,40';
    if (!l.active) {
      // つく直前はチカチカして知らせる
      const blinkOn = l.warn && Math.floor(elapsed * 12) % 2 === 0;
      ctx.strokeStyle = `rgba(${col},${blinkOn ? 0.6 : 0.15})`; ctx.lineWidth = blinkOn ? 2 : 1;
      ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      ctx.setLineDash([]);
      continue;
    }
    const flick = l.warn ? (Math.floor(elapsed * 12) % 2 ? 1 : 0.3) : 0.7 + Math.sin(elapsed * 30 + ax) * 0.3;
    ctx.strokeStyle = `rgba(${col},${0.25 * flick})`; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = `rgba(${col},${flick})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }
}

// 爆薬の地点と爆発
function drawBombs() {
  for (const b of bombs) {
    ctx.fillStyle = b.done ? 'rgba(60,60,60,0.6)' : b.armed ? 'rgba(255,80,60,0.9)' : 'rgba(255,200,60,0.9)';
    ctx.beginPath(); ctx.arc(b.x, b.y, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(b.label, b.x, b.y + 5);
  }
  for (const e of booms) {
    const k = 1 - e.t / 0.8;
    ctx.fillStyle = `rgba(255,${160 - k * 120},40,${0.8 * (1 - k)})`;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (0.3 + k * 0.7), 0, Math.PI * 2); ctx.fill();
  }
  // 通信可能エリア（バイクの行き先）
  if (stage.bike) {
    const p = stage.bike.path[stage.bike.path.length - 1];
    ctx.strokeStyle = 'rgba(255,80,80,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.arc(p[0] * TILE, p[1] * TILE, 60, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ff8080'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('通信可能エリア', p[0] * TILE, p[1] * TILE + 4);
  }
}

function drawPlayerVision() {
  const RAYS = 24, p = player;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  for (let i = 0; i <= RAYS; i++) {
    const a = p.dir - PLAYER_VIEW_ANGLE / 2 + PLAYER_VIEW_ANGLE * i / RAYS;
    const cos = Math.cos(a), sin = Math.sin(a);
    let d = 0;
    while (d < PLAYER_VIEW_RANGE) { if (solidAt(p.x + cos * d, p.y + sin * d)) break; d += 6; }
    ctx.lineTo(p.x + cos * d, p.y + sin * d);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(70,140,255,0.24)';
  ctx.fill();
}

function drawReticle(g) {
  const ready = player.cooldown <= 0 && player.ammo > 0;
  const r = 20 + Math.sin(elapsed * 8) * 2;
  ctx.strokeStyle = ready ? '#ff4040' : 'rgba(255,64,64,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(g.x - r - 6, g.y); ctx.lineTo(g.x - r + 6, g.y);
  ctx.moveTo(g.x + r - 6, g.y); ctx.lineTo(g.x + r + 6, g.y);
  ctx.moveTo(g.x, g.y - r - 6); ctx.lineTo(g.x, g.y - r + 6);
  ctx.moveTo(g.x, g.y + r - 6); ctx.lineTo(g.x, g.y + r + 6);
  ctx.stroke();
}

function drawShots() {
  for (const s of shots) {
    ctx.strokeStyle = `rgba(200,255,255,${s.t * 4})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
}

function drawItems() {
  for (const it of items) {
    if (it.taken) continue;
    const bob = Math.sin(elapsed * 4) * 2;
    if (it.kind === 'key') {
      ctx.strokeStyle = '#ffd54f'; ctx.fillStyle = '#ffd54f'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(it.x - 6, it.y + bob, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.fillRect(it.x - 1, it.y - 1.5 + bob, 13, 3);
      ctx.fillRect(it.x + 7, it.y + bob, 3, 6);
      continue;
    }
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(it.x - 10, it.y - 8 + bob, 20, 16);
    ctx.strokeStyle = '#a5d6a7'; ctx.lineWidth = 2;
    ctx.strokeRect(it.x - 10, it.y - 8 + bob, 20, 16);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('弾', it.x, it.y + 4 + bob);
  }
}

function drawGuard(g) {
  ctx.save();
  ctx.translate(g.x, g.y);
  if (g.type === 'camera') {
    // 監視カメラ（壁の小さな箱とレンズ）
    ctx.rotate(g.dir);
    ctx.fillStyle = hackTimer > 0 ? '#555' : '#ccc';
    ctx.fillRect(-8, -6, 16, 12);
    ctx.fillStyle = hackTimer > 0 ? '#333' : g.susp > 0.05 ? '#f44' : '#4cf';
    ctx.beginPath(); ctx.arc(9, 0, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    return;
  }
  if (g.type === 'bike') {
    ctx.rotate(g.dir);
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-12, 0, 6, 0, Math.PI * 2); ctx.arc(12, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = g.state === 'stun' ? '#666' : '#a33';
    ctx.fillRect(-12, -5, 24, 10);
    ctx.fillStyle = '#d8cfb8';
    ctx.beginPath(); ctx.arc(-2, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (g.state === 'stun') { ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('停止', g.x, g.y - 16); }
    return;
  }
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(2, 4, GUARD_R, GUARD_R * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(g.dir);
  ctx.fillStyle = g.state === 'stun' ? '#6a6a55' : g.type === 'chaser' ? '#5a2a2a' : '#4d5a2a';
  ctx.beginPath(); ctx.arc(0, 0, GUARD_R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2b3216'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.fillRect(6, 4, 16, 4);
  ctx.fillStyle = '#d8cfb8';
  ctx.beginPath(); ctx.arc(2, 0, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.font = 'bold 22px sans-serif';
  if (g.state === 'stun') {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('z z', g.x, g.y - 20 - Math.sin(elapsed * 3) * 3);
  } else if (g.state === 'alert') {
    ctx.fillStyle = '#ff3030';
    ctx.fillText('!', g.x, g.y - 20);
  } else if (g.susp > 0.05 || g.state === 'search') {
    ctx.fillStyle = '#ffb000';
    ctx.fillText('?', g.x, g.y - 20);
    if (g.susp > 0.05) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(g.x - 14, g.y - 44, 28, 5);
      ctx.fillStyle = '#ffb000'; ctx.fillRect(g.x - 14, g.y - 44, 28 * g.susp, 5);
    }
  }
}

// 牢の中の仲間（まだ救出していない人）
function drawPrisoners() {
  const waiting = prisoners.filter(p => !p.joined);
  for (const p of waiting) drawSoldier(p.x, p.y, Math.PI / 2, 0.9, ROLES.rescued, 0);
  if (waiting.length) {
    const p = waiting[0];
    ctx.fillStyle = '#ffd54f'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('別班員', p.x + 30, p.y - 18);
  }
}

// 部隊（後ろから順に描き、先頭を最後に描く）
function drawSquad() {
  if (player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0) return;
  for (let i = squad.length - 1; i >= 0; i--) {
    const m = squad[i], role = ROLES[m.role];
    drawSoldier(m.x, m.y, m.dir, i === 0 ? 1 : 0.85, role, player.walk + i);
  }
  // 先頭の目印と名前
  ctx.fillStyle = ROLES[squad[0].role].rim;
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 22); ctx.lineTo(player.x - 5, player.y - 30); ctx.lineTo(player.x + 5, player.y - 30);
  ctx.closePath(); ctx.fill();
  ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(ROLES[squad[0].role].name, player.x, player.y - 33);
}

function drawSoldier(x, y, dir, scale, role, walk) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(2, 4, PLAYER_R, PLAYER_R * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(dir);
  if (player.crouch) ctx.scale(1.25, 0.8);
  const swing = Math.sin(walk) * 5;
  ctx.fillStyle = '#1f2a3a';
  ctx.fillRect(-6 + swing, -8, 8, 5);
  ctx.fillRect(-6 - swing, 3, 8, 5);
  ctx.fillStyle = role.body;
  ctx.beginPath(); ctx.arc(0, 0, PLAYER_R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = role.rim; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#e0b48a';
  ctx.beginPath(); ctx.arc(3, 0, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(1, 0, 6, Math.PI * 0.5, Math.PI * 1.5); ctx.fill();
  ctx.restore();
}

function drawTorches() {
  if (blackoutTimer > 0) return;   // 停電中は消える
  for (const [tx, ty] of stage.torches || []) {
    const x = tx * TILE, y = ty * TILE;
    const f = Math.sin(elapsed * 13 + tx) * 2;
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(x - 2, y, 4, 10);
    ctx.fillStyle = '#ff9800';
    ctx.beginPath(); ctx.ellipse(x, y - 2, 5, 8 + f, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath(); ctx.ellipse(x, y, 2.5, 4 + f / 2, 0, 0, Math.PI * 2); ctx.fill();
  }
}

// 暗闇：画面全体を暗くし、明かりのある場所だけくり抜く
function drawDarkness(camX, camY) {
  if (!darkCanvas) darkCanvas = document.createElement('canvas');
  if (darkCanvas.width !== canvas.width || darkCanvas.height !== canvas.height) {
    darkCanvas.width = canvas.width; darkCanvas.height = canvas.height;
  }
  const d = darkCanvas.getContext('2d');
  const k = dpr * zoom;
  d.globalCompositeOperation = 'source-over';
  d.fillStyle = blackoutTimer > 0 ? 'rgba(0,0,6,0.97)' : 'rgba(0,0,6,0.93)';
  d.fillRect(0, 0, darkCanvas.width, darkCanvas.height);
  d.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r) => {
    const sx = (x - camX) * k, sy = (y - camY) * k, sr = r * k;
    const g = d.createRadialGradient(sx, sy, sr * 0.25, sx, sy, sr);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    d.fillStyle = g;
    d.beginPath(); d.arc(sx, sy, sr, 0, Math.PI * 2); d.fill();
  };
  const flick = Math.sin(elapsed * 9) * 6;
  hole(player.x, player.y, (blackoutTimer > 0 ? 110 : 210) + flick);
  if (blackoutTimer <= 0) for (const [tx, ty] of stage.torches || []) hole(tx * TILE, ty * TILE, 140 + Math.sin(elapsed * 11 + tx) * 8);
  for (const g of guards) if (g.type !== 'camera') hole(g.x, g.y, g.state === 'stun' ? 30 : 60);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(darkCanvas, 0, 0);
  ctx.setTransform(k, 0, 0, k, -camX * k, -camY * k);
}

function drawGoal() {
  const [gx, gy, gw, gh] = stage.goal;
  if (stage.needRescue && !prisoners.every(p => p.joined)) {
    ctx.fillStyle = '#ccc'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(stage.goalLabel, (gx + gw / 2) * TILE, (gy + gh / 2) * TILE + 5);
    return;
  }
  const a = 0.35 + Math.sin(elapsed * 4) * 0.2;
  ctx.fillStyle = `rgba(120,255,160,${a})`;
  ctx.fillRect(gx * TILE, gy * TILE, gw * TILE, gh * TILE);
  ctx.strokeStyle = '#8f8'; ctx.lineWidth = 2;
  ctx.strokeRect(gx * TILE, gy * TILE, gw * TILE, gh * TILE);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(stage.goalLabel, (gx + gw / 2) * TILE, (gy + gh / 2) * TILE + 5);
}

/* ---- 画面上の情報（左上パネル） ---- */
// ステージごとの追加情報の行
function hudLines() {
  const lines = [];
  if (stage.hacks > 0) lines.push([hackTimer > 0 ? `ハック作動中 ${Math.ceil(hackTimer)}秒` : `ハック残り ${player.hacks}回（H）`, hackTimer > 0 ? '#ff9ee0' : '#ddd']);
  if (stage.needRescue) {
    const n = prisoners.filter(p => p.joined).length;
    lines.push([`鍵：${hasKey ? 'あり' : 'なし'}　救出：${n}/${prisoners.length}`, hasKey ? '#ffd54f' : '#aaa']);
  }
  if (blackoutTimer > 0) lines.push([`停電中 ${Math.ceil(blackoutTimer)}秒`, '#ff8080']);
  if (stage.chase) lines.push([`追っ手 ${guards.filter(g => g.type === 'chaser' && g.state !== 'stun').length}人`, '#ff8080']);
  return lines;
}
function hudBoxH() { return 100 + hudLines().length * 20; }
function hudBottom() {
  return window.innerWidth < 460 ? 10 + hudBoxH() + 6 + 34 : 10 + hudBoxH() + 6;
}

function drawHUD() {
  const W = window.innerWidth, H = window.innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const boxH = hudBoxH();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(10, 10, 240, boxH);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(stage.name, 20, 30);
  ctx.font = '12px sans-serif';
  ctx.fillText('警戒度', 20, 52);
  ctx.fillStyle = '#333'; ctx.fillRect(68, 42, 170, 14);
  const col = alertLevel < 40 ? '#4caf50' : alertLevel < 75 ? '#ffb300' : '#ff3b30';
  ctx.fillStyle = col; ctx.fillRect(68, 42, 170 * alertLevel / 100, 14);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'right';
  ctx.fillText(Math.floor(alertLevel) + '%', 236, 53);
  ctx.textAlign = 'left';
  ctx.fillText('麻酔弾', 20, 76);
  for (let i = 0; i < Math.min(player.ammo, 12); i++) { ctx.fillStyle = '#9ef'; ctx.fillRect(68 + i * 13, 67, 8, 12); }
  if (player.ammo === 0) { ctx.fillStyle = '#f66'; ctx.fillText(stage.ammo ? '弾切れ' : 'なし', 68, 76); }
  // 部隊（人の形のマーク）
  ctx.fillStyle = '#fff'; ctx.fillText('部隊', 20, 98);
  const gap = squad.length > 10 ? 11 : 15;
  squad.forEach((m, i) => {
    const x = 74 + i * gap, y = 92;
    ctx.fillStyle = ROLES[m.role].rim;
    ctx.beginPath(); ctx.arc(x, y - 3, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(x - 4, y + 1, 8, 7);
  });
  hudLines().forEach(([text, color], i) => { ctx.fillStyle = color; ctx.fillText(text, 20, 120 + i * 20); });

  // 状態表示
  ctx.font = 'bold 14px sans-serif';
  let status = player.crouch ? 'ほふく中' : '通常';
  const nHidden = squad.filter(hidden).length;
  if (nHidden === squad.length) status = '全員 隠れている';
  else if (nHidden > 0) status = `${nHidden}人 隠れている`;
  const narrow = W < 460;
  const sx = narrow ? 10 : W - 190, sy = narrow ? 10 + boxH + 6 : 10;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(sx, sy, 180, 28);
  ctx.fillStyle = player.crouch ? '#9ec3ff' : '#fff';
  ctx.fillText(status, sx + 10, sy + 19);

  if (findShotTarget()) {
    const msg = player.ammo <= 0 ? '弾切れ' : player.cooldown > 0 ? '装填中…' : 'ACTION：麻酔銃';
    ctx.fillStyle = player.ammo > 0 && player.cooldown <= 0 ? 'rgba(200,40,40,0.8)' : 'rgba(120,40,40,0.8)';
    ctx.fillRect(sx, sy + 34, 180, 28);
    ctx.fillStyle = '#fff';
    ctx.fillText(msg, sx + 10, sy + 53);
  }

  if (guards.some(g => g.state === 'alert')) {
    ctx.strokeStyle = `rgba(255,0,0,${0.4 + Math.sin(elapsed * 10) * 0.2})`;
    ctx.lineWidth = 12;
    ctx.strokeRect(0, 0, W, H);
  }
  if (flashTimer > 0) { ctx.fillStyle = `rgba(255,0,0,${flashTimer * 0.8})`; ctx.fillRect(0, 0, W, H); }

  // 無線・ヒント：画面の下（操作ボタンの上）に数秒だけ表示
  if (hintTimer > 0 && hintText) {
    ctx.globalAlpha = Math.min(1, hintTimer);
    drawTextBox(hintText, W / 2, H - (narrow ? 210 : 70), Math.min(W - 20, 560), true);
    ctx.globalAlpha = 1;
  }
}

// 折り返して文字を並べる
function wrapText(text, maxW) {
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}
function drawTextBox(text, cx, top, maxW, bottom) {
  ctx.font = '13px sans-serif';
  const lines = wrapText(text, maxW - 20);
  const h = lines.length * 18 + 10;
  if (bottom) top -= h;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(cx - maxW / 2, top, maxW, h);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  lines.forEach((l, i) => ctx.fillText(l, cx, top + 19 + i * 18));
}

function fitText(text, x, y, size, bold, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px sans-serif`;
  const w = ctx.measureText(text).width;
  if (w > maxW) ctx.font = `${bold ? 'bold ' : ''}${Math.floor(size * maxW / w)}px sans-serif`;
  ctx.fillText(text, x, y);
}

function drawScreen(title, sub, lines, color, footer) {
  const W = window.innerWidth, H = window.innerHeight;
  const maxW = W - 24;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  fitText(title, W / 2, H * 0.2, 40, true, maxW);
  ctx.fillStyle = '#ccc';
  fitText(sub, W / 2, H * 0.2 + 38, 18, false, maxW);
  ctx.fillStyle = '#eee';
  lines.forEach((l, i) => fitText(l, W / 2, H * 0.33 + i * 24, 15, false, maxW));
  ctx.fillStyle = `rgba(255,255,255,${0.6 + Math.sin(performance.now() / 300) * 0.4})`;
  fitText(footer || 'SPACE / タップ で進む', W / 2, H * 0.9, 18, true, maxW);
}

// 会話の画面（無線のやりとり風）
function drawStory() {
  const W = window.innerWidth, H = window.innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#05080f'); grad.addColorStop(1, '#1a2230');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  // 走査線（モニター風）
  ctx.fillStyle = 'rgba(120,200,255,0.04)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#7fa3d6';
  fitText(storyTitle, W / 2, 80, 20, true, W - 40);
  // 左上の SKIP（右上は音のボタンがあるため）
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(8, 12, 92, 30);
  ctx.textAlign = 'left'; ctx.fillStyle = '#ddd'; ctx.font = 'bold 13px sans-serif';
  ctx.fillText('SKIP ▶▶', 20, 32);

  const [who, text] = storyLines[storyIdx] || ['', ''];
  const color = SPEAKERS[who] || '#ccc';
  const boxW = Math.min(W - 24, 640), bx = (W - boxW) / 2;
  ctx.font = '16px sans-serif';
  const lines = wrapText(text, boxW - 40);
  const boxH = Math.max(120, lines.length * 26 + 70);
  const by = H * 0.55 - boxH / 2;
  // 顔アイコン（名前の頭文字）
  if (who !== 'ナレーション') {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(W / 2, by - 50, 36, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(who[0], W / 2, by - 40);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(bx, by, boxW, boxH);
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.strokeRect(bx + 1, by + 1, boxW - 2, boxH - 2);
  ctx.textAlign = 'left';
  ctx.fillStyle = color; ctx.font = 'bold 15px sans-serif';
  ctx.fillText(who === 'ナレーション' ? '' : who, bx + 20, by + 28);
  ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, bx + 20, by + 56 + i * 26));
  ctx.textAlign = 'center'; ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(performance.now() / 300) * 0.4})`;
  ctx.font = '14px sans-serif';
  ctx.fillText(`▼ タップ / SPACE で次へ　（${storyIdx + 1}/${storyLines.length}）`, W / 2, by + boxH + 30);
}

function drawTitleBG() {
  const W = window.innerWidth, H = window.innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1b1f3a'); grad.addColorStop(0.7, '#6b4a3a'); grad.addColorStop(1, '#b89a6a');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#111';
  const base = H * 0.66, cx = W / 2;
  ctx.fillRect(cx - 160, base - 90, 320, 90);
  for (let i = -160; i < 160; i += 30) ctx.fillRect(cx + i, base - 106, 18, 16);
  ctx.fillRect(cx - 40, base - 170, 80, 80);
  ctx.fillRect(cx - 200, base - 130, 50, 130);
  ctx.fillRect(cx + 150, base - 130, 50, 130);
  ctx.fillStyle = '#ffcf6a';
  ctx.fillRect(cx - 8, base - 150, 16, 22);
}

// ステージ選択ボタン（狭い画面では2段）
function drawStageButtons() {
  const W = window.innerWidth, H = window.innerHeight;
  const perRow = W < 600 ? 3 : 5;
  const bw = Math.min(140, (W - 30) / perRow - 8), bh = 46;
  titleButtons = [];
  STAGES.forEach((s, i) => {
    const row = Math.floor(i / perRow), colI = i % perRow;
    const inRow = Math.min(perRow, STAGES.length - row * perRow);
    const total = inRow * (bw + 8) - 8;
    const x = W / 2 - total / 2 + colI * (bw + 8), y = H * 0.66 + row * (bh + 8);
    const locked = i >= unlocked;
    titleButtons.push({ x, y, w: bw, h: bh, index: i, locked });
    ctx.fillStyle = locked ? 'rgba(60,60,60,0.85)' : i === titleSelect ? 'rgba(255,207,106,0.95)' : 'rgba(30,30,40,0.9)';
    ctx.fillRect(x, y, bw, bh);
    ctx.strokeStyle = '#ffcf6a'; ctx.lineWidth = 2; ctx.strokeRect(x, y, bw, bh);
    ctx.fillStyle = i === titleSelect && !locked ? '#111' : locked ? '#888' : '#fff';
    ctx.textAlign = 'center';
    fitText('STAGE ' + (i + 1), x + bw / 2, y + 19, 14, true, bw - 8);
    fitText(locked ? '🔒 未解放' : s.name.replace(/^STAGE \d+\s+/, ''), x + bw / 2, y + 37, 11, false, bw - 8);
  });
}

function render() {
  document.body.classList.toggle('menu', scene !== 'play');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (scene === 'title') {
    drawTitleBG();
    drawScreen('シャキ城奪還作戦', '― ドラマ「VIVANT」モチーフのファンメイド潜入アクション ―', [
      '拉致された別班員を救出し、ゴルバドから脱出せよ',
      '移動：矢印キー / 左下パッド　麻酔銃：SPACE / ACTION',
      'ほふく：C / ほふくボタン　ハッキング：H / ハックボタン',
      '音のON/OFF：M / 🔊　　声のON/OFF：V / 「声」ボタン',
    ], '#ffcf6a', 'ステージを選んで SPACE / タップ で開始');
    drawStageButtons();
    return;
  }
  if (scene === 'story') { drawStory(); return; }
  if (scene === 'ending') {
    drawTitleBG();
    drawScreen('MISSION COMPLETE', 'シャキ城奪還作戦　完了', [
      '救出：別班員4名',
      '和田貢は、帰らぬ人となった。',
      '突入部隊：乃木・新庄・チョッキー・Y2K部隊',
      '情報支援：太田梨歩（ブルーウォーカー）・東条',
      '作戦指揮：乃木憂助・ノコル',
    ], '#ffcf6a', 'タップでタイトルへ');
    return;
  }

  // --- カメラ ---
  const W = stage.cols * TILE, H = stage.rows * TILE;
  const topPad = hudBottom() / zoom;
  let camX = player.x - viewW / 2, camY = player.y - viewH / 2;
  camX = viewW >= W ? (W - viewW) / 2 : Math.max(0, Math.min(W - viewW, camX));
  camY = Math.max(-topPad, Math.min(H - viewH, camY));
  if (viewH >= H + topPad) camY = (H - viewH) / 2 - topPad / 2;
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, -camX * dpr * zoom, -camY * dpr * zoom);

  ctx.drawImage(staticLayer, 0, 0);
  drawGoal();
  drawItems();
  drawBombs();
  drawTorches();
  drawLasers();
  drawPlayerVision();
  const dark = stage.theme === 'dungeon';
  if (!dark) guards.forEach(drawVision);
  drawPrisoners();
  drawSquad();
  guards.forEach(drawGuard);
  ctx.globalAlpha = 0.8;
  ctx.drawImage(bushLayer, 0, 0);
  ctx.globalAlpha = 1;
  if (dark) {
    drawDarkness(camX, camY);
    guards.forEach(drawVision);
    if (hackTimer > 0) guards.forEach(drawGuard);   // ハッキング中は見張りの位置が見える
  }
  lights.forEach(drawLight);
  const target = scene === 'play' ? findShotTarget() : null;
  if (target) drawReticle(target);
  drawShots();

  drawHUD();

  if (scene === 'clear') {
    const next = STAGES[stageIndex + 1];
    drawScreen(`STAGE ${stageIndex + 1} CLEAR`, stage.clearText, [
      `タイム：${elapsed.toFixed(1)} 秒　／　最終警戒度：${Math.floor(alertLevel)}%`,
      next ? `次は「${next.name.replace(/^STAGE \d+\s+/, '')}」` : '作戦の結末へ',
    ], '#8f8', 'SPACE / タップ で進む');
  } else if (scene === 'over') {
    drawScreen('GAME OVER', overReason, ['もう一度挑戦する'], '#ff5050');
  }
}

/* =========================================================
   メインループ
   ========================================================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
