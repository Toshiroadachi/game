<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>潜入作戦 ジャキ城奪還</title>
<style>
  /* ===== 画面全体のスタイル ===== */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #111; color: #eee;
    overflow: hidden;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    touch-action: none;              /* スマホでスクロール・拡大させない */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* ===== タッチ操作用ボタン ===== */
  #pad {
    position: fixed; left: 20px; bottom: 20px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.25);
    touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    pointer-events: none;
  }
  /* 十字の目印 */
  #pad::before, #pad::after {
    content: ""; position: absolute; background: rgba(255,255,255,0.15);
  }
  #pad::before { left: 50%; top: 12px; bottom: 12px; width: 2px; margin-left: -1px; }
  #pad::after  { top: 50%; left: 12px; right: 12px; height: 2px; margin-top: -1px; }

  #actBtn {
    position: fixed; right: 24px; bottom: 36px;
    width: 96px; height: 96px; border-radius: 50%;
    background: rgba(220,80,60,0.35);
    border: 2px solid rgba(255,160,140,0.6);
    color: #fff; font-size: 16px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #actBtn.on { background: rgba(220,80,60,0.7); }
  #crouchBtn {
    position: fixed; right: 132px; bottom: 24px;
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(80,120,220,0.35);
    border: 2px solid rgba(158,195,255,0.6);
    color: #fff; font-size: 13px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #crouchBtn.on { background: rgba(80,120,220,0.75); }
  #soundBtn {
    position: fixed; right: 10px; top: 84px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.4);
    color: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  /* タイトル画面などではパッド類を隠す */
  body.menu #pad, body.menu #actBtn, body.menu #crouchBtn { display: none; }
  body.menu #soundBtn { top: 10px; }
  /* マウス操作のPCでは少し控えめに表示 */
  @media (hover: hover) and (pointer: fine) {
    #pad, #actBtn, #crouchBtn { opacity: 0.45; }
  }
</style>
</head>
<body class="menu">
<canvas id="game"></canvas>
<div id="pad"><div id="knob"></div></div>
<div id="actBtn">ACTION</div>
<div id="crouchBtn">ほふく</div>
<div id="soundBtn">🔊</div>

<script>
'use strict';

/* =========================================================
   基本設定（数字を変えると難易度を調整できる）
   ========================================================= */
const TILE = 40;                 // 1マスの大きさ（ピクセル）
const PLAYER_SPEED = 150;        // 通常の移動速度（px/秒）
const CROUCH_SPEED = 70;         // ほふく時の移動速度
const PLAYER_R = 12;             // プレイヤーの当たり判定の半径
const GUARD_R = 13;              // 見張りの当たり判定の半径
const VIEW_RANGE = 200;          // 見張りの視界の距離
const VIEW_ANGLE = Math.PI / 2.6;// 見張りの視野角（全体）
const CROUCH_RANGE_RATE = 0.6;   // ほふく中は見つかる距離が短くなる
const STUN_TIME = 10;            // 麻酔で眠らせる時間（秒）
const PLAYER_VIEW_RANGE = 190;   // プレイヤーの視界（麻酔銃の射程）
const PLAYER_VIEW_ANGLE = Math.PI / 2.8; // プレイヤーの視野角
const SHOT_COOLDOWN = 1.5;       // 麻酔銃を撃ってから次に撃てるまでの時間（秒）
const CAUGHT_PENALTY = 30;       // 見張りに捕まった時に上がる警戒度
const SUSPECT_BASE = 0.4;        // 見張りが怪しむ速さ（基本）
const SUSPECT_NEAR = 1.6;        // 見張りが怪しむ速さ（近いほど加算）
const ALERT_PER_SEC = 15;        // 発見されている間に毎秒上がる警戒度
const ALERT_DECAY = 6;           // 見つかっていない間に毎秒下がる警戒度
const CHASE_SPEED = 112;         // 見張りが追いかける速さ
const AMMO_PICKUP = 2;           // 弾薬箱で増える麻酔弾の数
const SQUAD_SIZE = 10;           // 部隊の人数（先頭があなた、後ろに仲間が一列に並ぶ）
const SQUAD_GAP = 22;            // 隊員どうしの間隔（ピクセル）
const MEMBER_R = 10;             // 後ろの隊員の当たり判定の半径

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* =========================================================
   効果音・BGM（Web Audio API で音を合成。音声ファイルは使わない）
   ・スマホは画面に触れるまで音を出せないので、最初の操作で unlock() する
   ・スマホのスピーカーは低い音が出にくいので、音はやや高めにしている
   ========================================================= */
const Sound = (() => {
  let ac = null;          // AudioContext
  let master = null;      // 全体の音量
  let bgmGain = null;     // BGMの音量
  let muted = false;
  let bgmTimer = null;    // BGMの予約処理を回すタイマー
  let nextTime = 0;       // 次の音を鳴らす時刻
  let step = 0;           // BGMの何拍目か
  let tense = false;      // 見つかっている時はBGMを緊迫させる
  let theme = 0;          // ステージごとに曲を変える
  let drone = null;       // 不穏な持続音
  let wind = null;        // 環境音（風）

  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      // iPhoneのマナーモードでも音が出るようにする（対応ブラウザのみ）
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      ac = new AC();
      // 音を大きくしても割れないようにコンプレッサーを通す
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      comp.connect(ac.destination);
      master = ac.createGain();
      master.gain.value = muted ? 0 : 1.2;
      master.connect(comp);
      bgmGain = ac.createGain();
      bgmGain.gain.value = 0.6;
      bgmGain.connect(master);
    }
    if (ac.state === 'suspended') ac.resume();
  }

  // 時刻 t に音を鳴らす（周波数 f1 → f2 へ変化）
  function toneAt(t, f1, f2, dur, type, vol, out) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);       // プチッという雑音を防ぐ
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out || master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  // 今から delay 秒後に音を鳴らす
  function tone(f1, f2, dur, type = 'square', vol = 0.2, delay = 0) {
    if (!ac) return;
    toneAt(ac.currentTime + delay, f1, f2, dur, type, vol);
  }

  // ノイズ音（足音・発射音・ハイハットなど）
  let noiseBuf = null;
  function getNoise() {
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }
  function noiseAt(t, dur, vol, freq, out, type = 'bandpass') {
    const src = ac.createBufferSource(); src.buffer = getNoise();
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(out || master);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }
  function noise(dur, vol = 0.2, freq = 1000, delay = 0) {
    if (!ac) return;
    noiseAt(ac.currentTime + delay, dur, vol, freq);
  }

  /* ---- BGM ----
     16拍で1周。0は休み。数値は周波数(Hz)
     ・半音でぶつかる音（ラとシ♭など）を混ぜて不安な響きにしている
     ・時計のようなチクタク音で「時間がない」緊張感を出す */
  const N = { G2:98, Ab2:103.8, A2:110, Bb2:116.5, C3:130.8, Db3:138.6, D3:146.8, Eb3:155.6, E3:164.8, F3:174.6,
              A3:220, Bb3:233.1, D4:293.7, Eb4:311.1, E4:329.6, F4:349.2, A4:440, Bb4:466.2,
              C5:523.3, Db5:554.4, D5:587.3, Eb5:622.3, E5:659.3, F5:698.5 };
  const THEMES = [
    { // ステージ1：荒野（静かで不穏）
      bass: [N.A2,0,0,N.A2, 0,0,N.A2,0, N.Bb2,0,0,N.Bb2, 0,0,N.Ab2,0],
      lead: [N.E5,0,0,0, 0,0,0,0, N.F5,0,0,0, 0,0,N.E5,0],
      drone: N.A2,       // 持続音の高さ
      stepDur: 0.2,
    },
    { // ステージ2：中庭（少し速く、緊迫）
      bass: [N.D3,0,N.D3,0, N.D3,0,N.Eb3,0, N.D3,0,N.D3,0, N.C3,0,N.Db3,0],
      lead: [N.A4,0,0,N.Bb4, 0,0,0,0, N.D5,0,0,N.Eb5, 0,0,N.D5,0],
      drone: N.D3,
      stepDur: 0.17,
    },
  ];
  THEMES.push({ // ステージ3：地下牢（遅く、重く、水滴の音）
    bass: [N.E3,0,0,0, 0,0,N.F3,0, N.E3,0,0,0, 0,0,N.Eb3,0],
    lead: [0,0,0,0, N.Bb4,0,0,0, 0,0,0,0, N.A4,0,0,0],
    drone: N.E3 / 2,
    stepDur: 0.24,
    drip: true,
  });
  // 警戒中：速いベースと、半音で上下するサイレンのようなメロディ
  const ALERT_BASS = [N.A2,N.A3,N.A2,N.A3, N.A2,N.A3,N.Bb2,N.Bb3, N.A2,N.A3,N.A2,N.A3, N.Ab2,N.Ab2,N.Bb2,N.Bb2];
  const ALERT_LEAD = [N.E5,N.F5,N.E5,N.F5, N.E5,N.F5,N.E5,N.F5, N.Eb5,N.E5,N.Eb5,N.E5, N.F5,0,N.F5,0];

  function playStep(t) {
    const th = THEMES[theme] || THEMES[0];
    const i = step % 16;
    const dur = tense ? 0.12 : th.stepDur;
    if (tense) {
      toneAt(t, ALERT_BASS[i], ALERT_BASS[i], dur * 0.9, 'sawtooth', 0.14, bgmGain);
      if (ALERT_LEAD[i]) toneAt(t, ALERT_LEAD[i], ALERT_LEAD[i], dur * 0.9, 'square', 0.07, bgmGain);
      if (i % 4 === 0) { toneAt(t, 170, 45, 0.18, 'sine', 0.6, bgmGain); noiseAt(t, 0.02, 0.2, 1500, bgmGain); }
      if (i % 8 === 4) noiseAt(t, 0.15, 0.35, 1800, bgmGain);           // スネア
      noiseAt(t, 0.03, 0.10, 8000, bgmGain, 'highpass');                // ハイハット
    } else {
      if (th.bass[i]) toneAt(t, th.bass[i], th.bass[i], dur * 1.6, 'sawtooth', 0.12, bgmGain);
      if (th.lead[i]) toneAt(t, th.lead[i], th.lead[i] * 0.985, dur * 5, 'triangle', 0.10, bgmGain);
      // 時計のチクタク（交互に高さを変える）
      if (i % 2 === 0) toneAt(t, i % 4 === 0 ? 2400 : 1800, i % 4 === 0 ? 2400 : 1800, 0.025, 'square', 0.05, bgmGain);
      // 地下牢では、ときどき水滴の「ピチャ」という音
      if (th.drip && Math.random() < 0.12) toneAt(t, 1400 + Math.random() * 1400, 700, 0.09, 'sine', 0.18, bgmGain);
      // 遠くで鳴る太鼓のような低音
      if (i === 0 || i === 10) { toneAt(t, 120, 40, 0.35, 'sine', 0.55, bgmGain); noiseAt(t, 0.05, 0.12, 300, bgmGain); }
    }
    step++;
    return dur;
  }
  // 少し先の分まで音を予約していく（タイミングがずれにくい方法）
  function scheduler() {
    if (!ac) return;
    while (nextTime < ac.currentTime + 0.2) nextTime += playStep(nextTime);
  }

  // 不穏な持続音（2つの近い音を重ねて「うなり」を出す）
  function startDrone() {
    if (!ac || drone) return;
    const th = THEMES[theme] || THEMES[0];
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700; f.Q.value = 4;
    const g = ac.createGain(); g.gain.value = 0.05;
    const oscs = [th.drone, th.drone * 1.01, th.drone * 2 * 1.06].map(fr => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr;
      o.connect(f); o.start(); return o;
    });
    // フィルターをゆっくり開け閉めして、息づかいのように揺らす
    const lfo = ac.createOscillator(), lg = ac.createGain();
    lfo.frequency.value = 0.12; lg.gain.value = 400;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    f.connect(g); g.connect(bgmGain);
    drone = { oscs, lfo, f, g };
  }
  function stopDrone() {
    if (!drone) return;
    try { drone.oscs.forEach(o => o.stop()); drone.lfo.stop(); } catch (e) {}
    drone = null;
  }

  function startBGM(themeIndex) {
    stopBGM();
    theme = themeIndex || 0;
    step = 0; tense = false;
    if (!ac) return;
    nextTime = ac.currentTime + 0.1;
    bgmTimer = setInterval(scheduler, 50);
    startDrone();
    startWind();
  }
  function stopBGM() {
    if (bgmTimer) clearInterval(bgmTimer);
    bgmTimer = null;
    stopDrone();
    stopWind();
  }
  function setTension(on) {
    if (on === tense) return;
    tense = on;
    // 見つかったら持続音を明るく大きく（ざわつかせる）
    if (drone && ac) {
      drone.f.frequency.setTargetAtTime(on ? 1800 : 700, ac.currentTime, 0.2);
      drone.g.gain.setTargetAtTime(on ? 0.09 : 0.05, ac.currentTime, 0.2);
    }
  }

  // 環境音：風の音
  function startWind() {
    if (!ac || wind) return;
    const src = ac.createBufferSource(); src.buffer = getNoise(); src.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 0.7;
    const g = ac.createGain(); g.gain.value = 0.06;
    const lfo = ac.createOscillator(), lfoGain = ac.createGain();
    lfo.frequency.value = 0.15; lfoGain.gain.value = 300;
    lfo.connect(lfoGain); lfoGain.connect(f.frequency);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(); lfo.start();
    wind = { src, lfo };
  }
  function stopWind() {
    if (!wind) return;
    try { wind.src.stop(); wind.lfo.stop(); } catch (e) {}
    wind = null;
  }

  function toggleMute() {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 1.2;
    const b = document.getElementById('soundBtn');
    if (b) b.textContent = muted ? '🔇' : '🔊';
  }

  return {
    unlock, startBGM, stopBGM, setTension, toggleMute,
    // 足音（10人分なので「ザッ」と重めに。ほふく中は小さく）
    step: (soft) => {
      if (!ac) return;
      const t = ac.currentTime;
      noiseAt(t, 0.07, soft ? 0.18 : 0.45, soft ? 700 : 1100);
      noiseAt(t + 0.04, 0.06, soft ? 0.12 : 0.30, soft ? 500 : 800);
      if (!soft) toneAt(t, 140, 70, 0.06, 'sine', 0.3);
    },
    crouch:  () => { tone(500, 300, 0.1, 'triangle', 0.4); noise(0.08, 0.3, 900); },
    // 麻酔銃「バシュッ」
    shot:    () => { noise(0.18, 0.9, 2200); noise(0.05, 0.6, 5000); tone(1600, 300, 0.15, 'square', 0.25); tone(200, 60, 0.12, 'sine', 0.6); },
    hit:     () => { tone(400, 100, 0.35, 'square', 0.35); noise(0.25, 0.5, 500); },
    empty:   () => { tone(1500, 1500, 0.04, 'square', 0.3); tone(1500, 1500, 0.04, 'square', 0.3, 0.08); },
    pickup:  () => [880, 1175, 1568].forEach((f, i) => tone(f, f, 0.1, 'square', 0.25, i * 0.07)),
    // 「?」怪しまれた：不安な半音の2音
    suspect: () => { tone(740, 740, 0.12, 'square', 0.35); tone(784, 784, 0.25, 'square', 0.35, 0.12); noise(0.1, 0.2, 3000); },
    // 「!」見つかった：鋭い高音＋低い衝撃音
    alert:   () => {
      tone(1760, 1760, 0.08, 'square', 0.5); tone(2349, 2349, 0.4, 'square', 0.45, 0.07);
      tone(1245, 1245, 0.4, 'sawtooth', 0.3, 0.07);
      tone(150, 40, 0.5, 'sine', 0.9); noise(0.4, 0.6, 600);
    },
    siren:   () => { for (let i = 0; i < 3; i++) { tone(700, 1100, 0.25, 'sawtooth', 0.35, i * 0.5); tone(1100, 700, 0.25, 'sawtooth', 0.35, i * 0.5 + 0.25); } },
    // 心臓の鼓動「ドクン」（強さ 0〜1。近いほど大きく）
    heart: (k) => {
      if (!ac) return;
      const t = ac.currentTime, v = 0.35 + 0.65 * k;
      toneAt(t, 110, 45, 0.15, 'sine', v); noiseAt(t, 0.04, 0.25 * v, 250);
      toneAt(t + 0.16, 95, 40, 0.18, 'sine', v * 0.8); noiseAt(t + 0.16, 0.04, 0.2 * v, 200);
    },
    door:    () => { tone(200, 120, 0.4, 'sawtooth', 0.4); noise(0.4, 0.5, 300); tone(1200, 1200, 0.05, 'square', 0.3); },
    rescue:  () => [659, 784, 988, 1319].forEach((f, i) => tone(f, f, 0.2, 'triangle', 0.4, i * 0.12)),
    caught:  () => { noise(0.3, 0.8, 400); tone(300, 60, 0.4, 'sawtooth', 0.5); },
    start:   () => [523, 659, 784].forEach((f, i) => tone(f, f, 0.12, 'square', 0.25, i * 0.1)),
    clear:   () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, f, i === 5 ? 0.5 : 0.18, 'square', 0.3, i * 0.14)),
    gameOver:() => [392, 370, 330, 311, 196].forEach((f, i) => tone(f, f * 0.97, 0.45, 'sawtooth', 0.35, i * 0.28)),
  };
})();

/* =========================================================
   ステージデータ
   ・座標はすべて「マス」単位（ゲーム内でピクセルに変換）
   ・rocks は通れない障害物（ステージ1は岩、ステージ2は木箱）
   ・walls は城壁・建物、bushes は草むら（ほふくで隠れられる）
   ========================================================= */
const STAGES = [
  {
    name: 'STAGE 1  城外の荒野',
    theme: 'desert',
    cols: 40, rows: 25,
    start: [2, 12],
    goal: [37, 11, 2, 3],            // 到達地点 [x, y, 幅, 高さ]
    goalLabel: '城門',
    ammo: 4,                          // 最初に持っている麻酔弾
    ammoItems: [[19.5, 12.5]],        // 弾薬箱の位置
    rocks: [
      [6,4,2,3],[5,17,3,2],[11,6,3,3],[11,15,2,4],[15,2,2,5],[15,19,2,4],
      [20,9,2,2],[20,14,2,2],[24,3,3,2],[24,20,3,2],[23,11,1,3],
      [29,7,2,3],[29,15,2,3],[33,2,2,2],[33,21,2,2],
    ],
    // 城壁。右端が城、門の部分だけ開いている
    walls: [[36,0,4,11],[36,14,4,11]],

let bushLayer = null;     // 草むらを事前描画した画像

// 遊べるステージ数（クリアすると次が解放。ブラウザに保存）
let unlocked = 1;
try { unlocked = Math.max(1, Math.min(STAGES.length, parseInt(localStorage.getItem('jaki_unlocked'), 10) || 1)); } catch (e) {}
function unlockStage(n) {
  if (n <= unlocked) return;
  unlocked = Math.min(STAGES.length, n);
  try { localStorage.setItem('jaki_unlocked', String(unlocked)); } catch (e) {}
}

/* =========================================================
   入力（キーボード＋タッチ）
   ========================================================= */
const keys = {};
const touchVec = { x: 0, y: 0 };

window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key) || e.code === 'Space') {
    e.preventDefault();
  }
  if (e.repeat) return;
  keys[e.code] = true;
  Sound.unlock();
  // タイトル画面ではステージ選択
  if (scene === 'title') {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') titleSelect = Math.max(0, titleSelect - 1);
    if (e.code === 'ArrowRight' || e.code === 'ArrowDown') titleSelect = Math.min(unlocked - 1, titleSelect + 1);
  }
  if (e.code === 'Space' || e.code === 'Enter') onAction();
  if (e.code === 'KeyC' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') toggleCrouch();
  if (e.code === 'KeyM') Sound.toggleMute();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// --- 仮想パッド（ドラッグした方向に移動） ---
const pad = document.getElementById('pad');
const knob = document.getElementById('knob');
let padId = null;
function updatePad(e) {
  const r = pad.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const max = r.width / 2;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  // 中心付近は反応させない（遊び）
  if (len < 12) { touchVec.x = 0; touchVec.y = 0; return; }
  touchVec.x = dx / max;
  touchVec.y = dy / max;
}
pad.addEventListener('pointerdown', e => {
  padId = e.pointerId; pad.setPointerCapture(e.pointerId); updatePad(e); e.preventDefault();
});
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) updatePad(e); });
const padEnd = e => {
  if (e.pointerId !== padId) return;
  padId = null; touchVec.x = 0; touchVec.y = 0; knob.style.transform = '';
};
pad.addEventListener('pointerup', padEnd);
pad.addEventListener('pointercancel', padEnd);

// --- アクションボタン ---
const actBtn = document.getElementById('actBtn');
actBtn.addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); actBtn.classList.add('on'); onAction(); });
actBtn.addEventListener('pointerup', () => actBtn.classList.remove('on'));
actBtn.addEventListener('pointercancel', () => actBtn.classList.remove('on'));
// --- ほふくボタン ---
const crouchBtn = document.getElementById('crouchBtn');
crouchBtn.addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); toggleCrouch(); });
// --- 音のON/OFFボタン ---
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); Sound.toggleMute(); });
// どこかに触れた最初のタイミングで音を使えるようにする（スマホは操作がないと音が出せないため）
window.addEventListener('pointerdown', () => Sound.unlock(), true);
window.addEventListener('touchend', () => Sound.unlock(), true);
// タイトル画面などでは画面タップでも進める
canvas.addEventListener('pointerdown', e => {
  if (scene === 'play') return;
  if (scene === 'title') {
    // ステージボタンをタップしたら、そのステージを選ぶ
    const b = titleButtons.find(b => e.clientX >= b.x && e.clientX <= b.x + b.w &&
                                     e.clientY >= b.y && e.clientY <= b.y + b.h);
    if (b) { if (b.locked) return; titleSelect = b.index; }
  }
  onAction();
});

// 移動方向を取得（キーボードとタッチを合成）
function getMoveVec() {
  let x = 0, y = 0;
  if (keys.ArrowLeft || keys.KeyA) x -= 1;
  if (keys.ArrowRight || keys.KeyD) x += 1;
  if (keys.ArrowUp || keys.KeyW) y -= 1;
  if (keys.ArrowDown || keys.KeyS) y += 1;
  x += touchVec.x; y += touchVec.y;
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  return { x, y };
}

// スペース／アクションボタンが押されたとき
function onAction() {
  if (scene === 'title') { startStage(titleSelect); return; }
  if (scene === 'over')  { startStage(stageIndex); return; }
  if (scene === 'clear') {
    // 次のステージがあれば進む。なければタイトルへ
    if (stageIndex + 1 < STAGES.length) startStage(stageIndex + 1);
    else { titleSelect = stageIndex; scene = 'title'; }
    return;
  }
  if (scene !== 'play') return;

  // 麻酔銃：自分の視界の中にいる見張りを眠らせる
  if (player.cooldown > 0) return;
  if (player.ammo <= 0) { Sound.empty(); player.cooldown = 0.3; return; }
  player.cooldown = SHOT_COOLDOWN;
  player.ammo--;
  const target = findShotTarget();
  if (target) {
    target.state = 'stun';
    target.stunTimer = STUN_TIME;
    target.susp = 0;
    shots.push({ x1: player.x, y1: player.y, x2: target.x, y2: target.y, t: 0.25 });
    Sound.shot(); setTimeout(() => Sound.hit(), 120);
  } else {
    // 視界に敵がいない時は空撃ち（前方へ弾が飛ぶだけ）
    shots.push({ x1: player.x, y1: player.y,
      x2: player.x + Math.cos(player.dir) * PLAYER_VIEW_RANGE,
      y2: player.y + Math.sin(player.dir) * PLAYER_VIEW_RANGE, t: 0.25 });
    Sound.shot();
  }
}

// ほふく（低い姿勢）の切り替え
function toggleCrouch() {
  if (scene !== 'play') return;
  player.crouch = !player.crouch;
  crouchBtn.classList.toggle('on', player.crouch);
  Sound.crouch();
}

/* =========================================================
   ステージの準備
   ========================================================= */
function startStage(index) {
  stageIndex = index;
  stage = STAGES[index];
  const { cols, rows } = stage;

  // マス目を作成（外周は通れないようにする）
  grid = [];
  bushGrid = [];
  for (let y = 0; y < rows; y++) {
    grid.push(new Array(cols).fill(0));
    bushGrid.push(new Array(cols).fill(false));
  }
  const edge = stage.theme === 'desert' ? 1 : 2;   // 外周：荒野は岩、城内は壁
  for (let x = 0; x < cols; x++) { grid[0][x] = edge; grid[rows - 1][x] = edge; }
  for (let y = 0; y < rows; y++) { grid[y][0] = edge; }
  const fill = (rects, v) => rects.forEach(([rx, ry, rw, rh]) => {
    for (let y = ry; y < ry + rh; y++)
      for (let x = rx; x < rx + rw; x++)
        if (grid[y] && x < cols) grid[y][x] = v;
  });
  fill(stage.rocks, 1);
  fill(stage.walls, 2);
  // 文字で描いたマップ（ステージ3）を読み込む
  if (stage.map) {
    const code = { '#': 2, 'b': 1, 'D': 3, 'B': 4 };
    stage.map.forEach((row, y) => [...row].forEach((ch, x) => {
      grid[y][x] = code[ch] || 0;
      if (ch === 'w') bushGrid[y][x] = true;
    }));
  }
  stage.bushes.forEach(([rx, ry, rw, rh]) => {
    for (let y = ry; y < ry + rh; y++)
      for (let x = rx; x < rx + rw; x++) bushGrid[y][x] = true;
  });

  // プレイヤー
  player = {
    x: (stage.start[0] + 0.5) * TILE, y: (stage.start[1] + 0.5) * TILE,
    dir: 0, crouch: false, walk: 0,
    cooldown: 0,      // 麻酔銃の再使用までの時間
    invuln: 0,        // 捕まった直後の無敵時間
    stepTimer: 0,     // 足音の間隔
    heartTimer: 0,    // 心臓の音の間隔
    trail: [],        // 先頭が通った道すじ（後ろの隊員がたどる）
    ammo: stage.ammo, // 麻酔弾の残り
  };
  initTrail();
  updateSquad();
  crouchBtn.classList.remove('on');
  shots = [];
  flashTimer = 0;

  // 見張り
  guards = stage.guards.map(g => {
    const p = g.type === 'turn' ? g.pos : g.waypoints[0];
    return {
      ...g,
      x: p[0] * TILE, y: p[1] * TILE,
      homeX: p[0] * TILE, homeY: p[1] * TILE,
      dir: g.type === 'turn' ? g.center : 0,
      wp: 1, wpStep: 1,
      wait: 0,
      state: 'patrol',     // 'patrol' | 'alert' | 'search' | 'return' | 'stun'
      susp: 0,             // 怪しさ（1で発見）
      seen: false,         // 今プレイヤーが見えているか
      lastX: 0, lastY: 0,  // 最後にプレイヤーを見た位置
      lostTimer: 0, searchTimer: 0, stunTimer: 0,
      pause: 0,            // 捕まえた直後に立ち止まる時間（その間に逃げられる）
      phase: Math.random() * 6,
    };
  });

  // サーチライト
  lights = (stage.searchlights || []).map(l => ({
    ...l,
    x: l.path[0][0] * TILE, y: l.path[0][1] * TILE,
    wp: 1, wpStep: 1,
    susp: 0,         // 照らされている度合い（1で警報）
    cool: 0,         // 警報の後、次に鳴るまでの時間
  }));

  // 弾薬箱
  items = (stage.ammoItems || []).map(([x, y]) => ({ x: x * TILE, y: y * TILE, taken: false, kind: 'ammo' }));
  if (stage.key) items.push({ x: stage.key[0] * TILE, y: stage.key[1] * TILE, taken: false, kind: 'key' });
  hasKey = false;
  hostage = stage.hostage ? { x: stage.hostage[0] * TILE, y: stage.hostage[1] * TILE, joined: false, walk: 0 } : null;

  alertLevel = 0;
  elapsed = 0;
  hintText = stage.intro;
  hintTimer = 6;
  shownHints = new Set();
  buildLayers();
  resize();
  scene = 'play';
  Sound.start();
  Sound.startBGM(index);
}

/* =========================================================
   当たり判定まわり
   ========================================================= */
// その座標が視線をさえぎるか（鉄格子 4 は通れないが、視線は通る）
function solidAt(px, py) {
  const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (ty < 0 || ty >= stage.rows || tx < 0 || tx >= stage.cols) return true;
  return grid[ty][tx] !== 0 && grid[ty][tx] !== 4;
}
// 円（半径r）がどこかの壁に重なっているか
function circleHitsWall(x, y, r) {
  const x0 = Math.floor((x - r) / TILE), x1 = Math.floor((x + r) / TILE);
  const y0 = Math.floor((y - r) / TILE), y1 = Math.floor((y + r) / TILE);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (ty < 0 || ty >= stage.rows || tx < 0 || tx >= stage.cols) return true;
      if (grid[ty][tx] === 0) continue;
      // 円と四角形の最近点で判定
      const cx = Math.max(tx * TILE, Math.min(x, (tx + 1) * TILE));
      const cy = Math.max(ty * TILE, Math.min(y, (ty + 1) * TILE));
      if ((x - cx) ** 2 + (y - cy) ** 2 < r * r) return true;
    }
  }
  return false;
}
// 壁で止まりながら移動（X方向とY方向を別々に判定して壁沿いに滑らせる）
function moveWithCollision(obj, dx, dy, r) {
  if (!circleHitsWall(obj.x + dx, obj.y, r)) obj.x += dx;
  if (!circleHitsWall(obj.x, obj.y + dy, r)) obj.y += dy;
}
// 2点間の視線が通るか（障害物や壁で遮られていないか）
function lineOfSight(x1, y1, x2, y2) {
  const d = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.ceil(d / 6);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (solidAt(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)) return false;
  }
  return true;
}
// 角度の差を -π〜π に正規化
function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
// 向きをなめらかに目標へ回転
function turnToward(g, target, speed, dt) {
  const d = angleDiff(target, g.dir);
  const step = speed * dt;
  g.dir += Math.abs(d) < step ? d : Math.sign(d) * step;
}
function inBush(x, y) {
  const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
  return !!(bushGrid[ty] && bushGrid[ty][tx]);
}
// その隊員が草むらでほふくして隠れているか
function hidden(m) {
  return player.crouch && inBush(m.x, m.y);
}
// 全員が隠れているか
function allHidden() { return squad.every(hidden); }

/* =========================================================
   部隊（10人が一列で進む）
   ・先頭（あなた）が通った道すじ trail を記録し、
     後ろの隊員はその道すじを一定間隔でたどる
   ========================================================= */
let squad = [];   // 隊員の位置 [{x, y, dir}]。0番目が先頭
// 今の部隊の人数（人質を救出したら最後尾に加わる）
function squadCount() { return SQUAD_SIZE + (hostage && hostage.joined ? 1 : 0); }

// ステージ開始時に、隊員が最初から一列に並んでいるよう道すじを作る
// （先頭の後ろ側＝左へ伸ばし、壁に当たったら下・上へ曲げる）
function initTrail() {
  const t = player.trail = [];
  const dirs = [[-1, 0], [0, 1], [0, -1], [1, 0]];
  let x = player.x, y = player.y, di = 0;
  const need = SQUAD_GAP * SQUAD_SIZE + 40;
  for (let len = 0; len < need; len += 3) {
    let tries = 0;
    while (tries < 4 && circleHitsWall(x + dirs[di][0] * 3, y + dirs[di][1] * 3, MEMBER_R)) {
      di = (di + 1) % 4; tries++;
    }
    if (tries >= 4) break;
    x += dirs[di][0] * 3; y += dirs[di][1] * 3;
    t.push({ x, y });
  }
}

function recordTrail() {
  const t = player.trail;
  const last = t[0];
  if (!last || Math.hypot(player.x - last.x, player.y - last.y) >= 3) {
    t.unshift({ x: player.x, y: player.y });
    // 必要な長さ以上の古い点は捨てる
    const need = SQUAD_GAP * (SQUAD_SIZE + 1) + 40;
    let d = 0;
    for (let i = 1; i < t.length; i++) {
      d += Math.hypot(t[i].x - t[i - 1].x, t[i].y - t[i - 1].y);
      if (d > need) { t.length = i + 1; break; }
    }
  }
}
function updateSquad() {
  const t = player.trail;
  squad = [{ x: player.x, y: player.y, dir: player.dir, leader: true }];
  // 道すじを先頭からたどって、GAPごとに隊員を置く
  let want = SQUAD_GAP, acc = 0, prev = { x: player.x, y: player.y };
  let i = 0;
  const count = squadCount();
  while (squad.length < count) {
    const p = t[i];
    if (!p) {
      // 道すじが足りない（スタート直後）は最後の点に重ねる
      squad.push({ x: prev.x, y: prev.y, dir: player.dir });
      continue;
    }
    const seg = Math.hypot(p.x - prev.x, p.y - prev.y);
    if (acc + seg >= want && seg > 0) {
      const k = (want - acc) / seg;
      const x = prev.x + (p.x - prev.x) * k, y = prev.y + (p.y - prev.y) * k;
      squad.push({ x, y, dir: Math.atan2(prev.y - p.y, prev.x - p.x) });
      prev = { x, y }; acc = 0; want = SQUAD_GAP;
    } else {
      acc += seg; prev = p; i++;
    }
  }
}

/* =========================================================
   見張りがプレイヤーを見ているか
   ========================================================= */
function guardCanSee(g) {
  if (g.state === 'stun') return null;
  // 一番近くで見えている隊員を返す
  let best = null, bestD = Infinity;
  for (const m of squad) {
    const d = Math.hypot(m.x - g.x, m.y - g.y);
    if (d < bestD && guardCanSeeMember(g, m)) { best = m; bestD = d; }
  }
  return best;
}
function guardCanSeeMember(g, m) {
  const dx = m.x - g.x, dy = m.y - g.y;
  const dist = Math.hypot(dx, dy);
  // ほふく中は見つかる距離が短い
  let range = VIEW_RANGE * (player.crouch ? CROUCH_RANGE_RATE : 1);
  if (g.state === 'alert') range = VIEW_RANGE * 1.2; // 警戒中はよく見ている
  // ほふくで草むらに隠れていると、すぐ近く以外は見えない
  if (hidden(m) && g.state !== 'alert') range = 45;
  if (dist > range) return false;
  // すぐ近く（体が触れるほど）なら向きに関係なく気づく
  if (dist > 30 && Math.abs(angleDiff(Math.atan2(dy, dx), g.dir)) > VIEW_ANGLE / 2) return false;
  return lineOfSight(g.x, g.y, m.x, m.y);
}

// プレイヤーの視界の中にいる見張り（麻酔銃で狙える相手）を探す。一番近い相手を返す
function findShotTarget() {
  let best = null, bestD = Infinity;
  for (const g of guards) {
    if (g.state === 'stun') continue;
    const dx = g.x - player.x, dy = g.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > PLAYER_VIEW_RANGE || d >= bestD) continue;
    // すぐ近くなら向きに関係なく狙える
    if (d > 35 && Math.abs(angleDiff(Math.atan2(dy, dx), player.dir)) > PLAYER_VIEW_ANGLE / 2) continue;
    if (!lineOfSight(player.x, player.y, g.x, g.y)) continue;
    best = g; bestD = d;
  }
  return best;
}

/* =========================================================
   更新処理
   ========================================================= */
function update(dt) {
  if (scene !== 'play') return;
  elapsed += dt;
  if (hintTimer > 0) hintTimer -= dt;
  if (player.cooldown > 0) player.cooldown -= dt;
  if (player.invuln > 0) player.invuln -= dt;
  if (flashTimer > 0) flashTimer -= dt;
  shots.forEach(s => s.t -= dt);
  shots = shots.filter(s => s.t > 0);

  // --- プレイヤーの移動 ---
  const mv = getMoveVec();
  const speed = player.crouch ? CROUCH_SPEED : PLAYER_SPEED;
  if (mv.x || mv.y) {
    player.dir = Math.atan2(mv.y, mv.x);
    player.walk += dt * (player.crouch ? 6 : 12);
    moveWithCollision(player, mv.x * speed * dt, mv.y * speed * dt, PLAYER_R);
    recordTrail();
    // 足音（ほふく中は小さく、ゆっくり）
    player.stepTimer -= dt;
    if (player.stepTimer <= 0) {
      Sound.step(player.crouch);
      player.stepTimer = player.crouch ? 0.55 : 0.3;
    }
  }

  updateSquad();

  // --- ヒント：新しいエリアに入った時に1回だけ数秒表示 ---
  const tx = player.x / TILE, ty = player.y / TILE;
  const h = stage.hints.find(h => tx >= h.area[0] && tx < h.area[0] + h.area[2] &&
                                  ty >= h.area[1] && ty < h.area[1] + h.area[3]);
  if (h && !shownHints.has(h) && hintTimer <= 0.3) { shownHints.add(h); hintText = h.text; hintTimer = 5; }

  // --- 弾薬箱・鍵を拾う ---
  for (const it of items) {
    if (!it.taken && Math.hypot(player.x - it.x, player.y - it.y) < 24) {
      it.taken = true;
      if (it.kind === 'key') { hasKey = true; showHint('牢の鍵を手に入れた！ 右上の牢へ向かえ。'); }
      else player.ammo += AMMO_PICKUP;
      Sound.pickup();
    }
  }

  // --- 牢の扉：鍵を持って近づくと開く ---
  for (let y = 0; y < stage.rows; y++) {
    for (let x = 0; x < stage.cols; x++) {
      if (grid[y][x] !== 3) continue;
      const near = Math.hypot(player.x - (x + 0.5) * TILE, player.y - (y + 0.5) * TILE) < TILE;
      if (!near) continue;
      if (hasKey) {
        grid[y][x] = 0;
        buildLayers();
        Sound.door();
        showHint('扉が開いた。人質に近づいて連れ出せ。');
      } else if (hintTimer <= 0) {
        showHint('扉には鍵がかかっている。鍵は看守部屋にある。');
      }
    }
  }

  // --- 人質：近づくと最後尾に加わる ---
  if (hostage && !hostage.joined && Math.hypot(player.x - hostage.x, player.y - hostage.y) < 34) {
    hostage.joined = true;
    Sound.rescue();
    showHint('人質を確保した！ 全員で左上の階段まで戻れ。');
  }

  // --- 見張りの行動 ---
  let anyAlert = false;
  for (const g of guards) {
    updateGuard(g, dt);
    if (g.state === 'alert') anyAlert = true;
    // 警戒中の見張りに隊員の誰かが捕まると警戒度が大きく上がる
    const caught = g.state === 'alert' && player.invuln <= 0 &&
      squad.find((m, i) => Math.hypot(m.x - g.x, m.y - g.y) < (i ? MEMBER_R : PLAYER_R) + GUARD_R);
    if (caught) {
      alertLevel = Math.min(100, alertLevel + CAUGHT_PENALTY);
      player.invuln = 1.5;
      g.pause = 1.2;
      flashTimer = 0.4;
      // 先頭が捕まった時は突き飛ばされる
      if (caught.leader) {
        const a = Math.atan2(player.y - g.y, player.x - g.x);
        moveWithCollision(player, Math.cos(a) * 40, Math.sin(a) * 40, PLAYER_R);
        recordTrail();
      }
      Sound.caught();
    }
  }

  // --- 心臓の鼓動：見張りが近い・怪しまれているほど速く大きく ---
  let danger = 0;
  for (const g of guards) {
    if (g.state === 'stun') continue;
    let near = Infinity;
    for (const m of squad) near = Math.min(near, Math.hypot(m.x - g.x, m.y - g.y));
    danger = Math.max(danger, 1 - near / 260, g.susp, g.state === 'alert' ? 1 : 0);
  }
  for (const l of lights) danger = Math.max(danger, l.susp);
  player.heartTimer -= dt;
  if (danger > 0 && player.heartTimer <= 0) {
    Sound.heart(danger);
    player.heartTimer = 1.1 - 0.65 * danger;   // 危険なほど間隔が短い
  }

  // --- サーチライト ---
  for (const l of lights) updateLight(l, dt);

  Sound.setTension(anyAlert);

  // --- 警戒度 ---
  if (!anyAlert) alertLevel = Math.max(0, alertLevel - ALERT_DECAY * dt);
  if (alertLevel >= 100) { gameOver('警戒度が最大になった！'); return; }

  // --- ゴール判定（人質が必要なステージでは、救出するまでゴールできない） ---
  const [gx, gy, gw, gh] = stage.goal;
  const goalOpen = !stage.needHostage || (hostage && hostage.joined);
  if (goalOpen && player.x > gx * TILE && player.x < (gx + gw) * TILE &&
      player.y > gy * TILE && player.y < (gy + gh) * TILE) {
    scene = 'clear';
    unlockStage(stageIndex + 2);
    Sound.stopBGM();
    Sound.clear();
  }
}

// サーチライトの移動と、照らされた時の警報
function updateLight(l, dt) {
  // 決まったルートを移動（往復または周回）
  const p = l.path[l.wp];
  const tx = p[0] * TILE, ty = p[1] * TILE;
  const dx = tx - l.x, dy = ty - l.y, d = Math.hypot(dx, dy);
  const step = l.speed * dt;
  if (d <= step) {
    l.x = tx; l.y = ty;
    if (l.path.length > 2) l.wp = (l.wp + 1) % l.path.length;
    else l.wp = 1 - l.wp;
  } else {
    l.x += dx / d * step; l.y += dy / d * step;
  }

  if (l.cool > 0) { l.cool -= dt; return; }
  // 照らされているか（草むらにほふくで隠れていれば見つからない）
  const lit = squad.find(m => Math.hypot(m.x - l.x, m.y - l.y) < l.r && !hidden(m));
  if (lit) {
    const before = l.susp;
    l.susp += dt * 1.4;
    if (before === 0) Sound.suspect();
    if (l.susp >= 1) {
      // 警報！ 近くの見張りが一斉にプレイヤーの位置へ向かう
      l.susp = 0;
      l.cool = 4;
      alertLevel = Math.min(100, alertLevel + 20);
      Sound.siren();
      for (const g of guards) {
        if (g.state === 'stun') continue;
        if (Math.hypot(g.x - lit.x, g.y - lit.y) > 500) continue;
        g.state = 'alert'; g.susp = 1; g.lostTimer = 0;
        g.lastX = lit.x; g.lastY = lit.y;
      }
    }
  } else {
    l.susp = Math.max(0, l.susp - dt * 0.8);
  }
}

function updateGuard(g, dt) {
  const PATROL_SPEED = 55;

  // 気絶中
  if (g.state === 'stun') {
    g.stunTimer -= dt;
    if (g.stunTimer <= 0) { g.state = 'return'; }
    g.seen = false;
    return;
  }

  // プレイヤーが見えるか
  const seenM = guardCanSee(g);
  g.seen = !!seenM;
  if (seenM) { g.lastX = seenM.x; g.lastY = seenM.y; }

  if (g.state === 'alert') {
    // 捕まえた直後は少し立ち止まる
    if (g.pause > 0) { g.pause -= dt; return; }
    // --- 警戒状態：プレイヤーを追いかける ---
    if (g.seen) {
      g.lostTimer = 0;
      alertLevel = Math.min(100, alertLevel + ALERT_PER_SEC * dt);
    } else {
      g.lostTimer += dt;
      if (g.lostTimer > 3) { g.state = 'search'; g.searchTimer = 3; g.susp = 0.2; }
    }
    moveGuardTo(g, g.lastX, g.lastY, CHASE_SPEED, dt);
    return;
  }

  // --- 怪しさの増減 ---
  if (g.seen) {
    const dist = Math.hypot(seenM.x - g.x, seenM.y - g.y);
    // 近いほど早く気づく
    const before = g.susp;
    g.susp += dt * (SUSPECT_BASE + SUSPECT_NEAR * Math.max(0, 1 - dist / VIEW_RANGE));
    if (before < 0.05 && g.susp >= 0.05) Sound.suspect();
    if (g.susp >= 1) {
      g.susp = 1;
      g.state = 'alert';
      g.lostTimer = 0;
      alertLevel = Math.min(100, alertLevel + 20);  // 発見された瞬間に上がる
      Sound.alert();
      return;
    }
  } else {
    g.susp = Math.max(0, g.susp - dt * 0.35);
  }

  // 少し怪しいと思ったら立ち止まってその方向を見る
  if (g.susp > 0.25) {
    turnToward(g, Math.atan2(g.lastY - g.y, g.lastX - g.x), 3, dt);
    return;
  }

  if (g.state === 'search') {
    // --- 捜索：最後に見た地点まで行き、周りを見回す ---
    const arrived = moveGuardTo(g, g.lastX, g.lastY, PATROL_SPEED * 1.4, dt);
    if (arrived) {
      g.dir += dt * 2.5;
      g.searchTimer -= dt;
      if (g.searchTimer <= 0) g.state = 'return';
    }
    return;
  }

  if (g.state === 'return') {
    // --- 持ち場へ戻る ---
    let tx = g.homeX, ty = g.homeY;
    if (g.type === 'patrol') { const p = g.waypoints[g.wp]; tx = p[0] * TILE; ty = p[1] * TILE; }
    if (moveGuardTo(g, tx, ty, PATROL_SPEED * 1.2, dt)) g.state = 'patrol';
    return;
  }

  // --- 通常の巡回 ---
  if (g.type === 'turn') {
    // その場で首を左右に振る
    g.phase += dt * 0.8;
    const target = g.center + Math.sin(g.phase) * g.amp;
    turnToward(g, target, 2, dt);
    return;
  }
  if (g.wait > 0) { g.wait -= dt; return; }
  const p = g.waypoints[g.wp];
  if (moveGuardTo(g, p[0] * TILE, p[1] * TILE, PATROL_SPEED, dt)) {
    g.wait = 1.2;   // 曲がり角で少し立ち止まる
    if (g.loop) {
      g.wp = (g.wp + 1) % g.waypoints.length;
    } else {
      // 往復：端に着いたら折り返す
      if (g.wp + g.wpStep >= g.waypoints.length || g.wp + g.wpStep < 0) g.wpStep *= -1;
      g.wp += g.wpStep;
    }
  }
}

// 見張りを目標地点へ動かす。着いたら true を返す
function moveGuardTo(g, tx, ty, speed, dt) {
  const dx = tx - g.x, dy = ty - g.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 4) return true;
  const ang = Math.atan2(dy, dx);
  turnToward(g, ang, 5, dt);
  const step = Math.min(dist, speed * dt);
  moveWithCollision(g, Math.cos(ang) * step, Math.sin(ang) * step, GUARD_R);
  return false;
}

// ヒントをすぐに表示する
function showHint(text) {
  hintText = text;
  hintTimer = 4;
}

function gameOver(reason) {
  overReason = reason;
  scene = 'over';
  Sound.stopBGM();
  Sound.gameOver();
}

/* =========================================================
   描画
   ========================================================= */
let viewW = 800, viewH = 450, zoom = 1, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  // 画面サイズに合わせて表示倍率を決める（スマホ縦でも見やすく）
  zoom = Math.max(0.55, Math.min(window.innerWidth / 760, window.innerHeight / 480));
  // ステージより画面が大きくなって黒い余白が出ないよう、最低倍率を調整
  if (stage) zoom = Math.max(zoom, window.innerWidth / (stage.cols * TILE), window.innerHeight / (stage.rows * TILE));
  viewW = window.innerWidth / zoom;
  viewH = window.innerHeight / zoom;
}
window.addEventListener('resize', resize);
resize();

// 疑似乱数（毎回同じ模様になるように）
function seededRandom(seed) {
  return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
}

// 地面・障害物・壁・草むらを事前に描いておく（毎フレーム描くと重いため）
function buildLayers() {
  const W = stage.cols * TILE, H = stage.rows * TILE;
  const rnd = seededRandom(12345 + stageIndex);
  const desert = stage.theme === 'desert';

  staticLayer = document.createElement('canvas');
  staticLayer.width = W; staticLayer.height = H;
  const c = staticLayer.getContext('2d');

  if (desert) {
    // 荒野の地面
    c.fillStyle = '#b89a6a';
    c.fillRect(0, 0, W, H);
    for (let i = 0; i < 2500; i++) {
      c.fillStyle = rnd() < 0.5 ? 'rgba(90,60,30,0.15)' : 'rgba(255,240,200,0.15)';
      const s = 1 + rnd() * 3;
      c.fillRect(rnd() * W, rnd() * H, s, s);
    }
    // 轍（わだち）っぽい道
    c.strokeStyle = 'rgba(120,90,50,0.25)';
    c.lineWidth = 18;
    c.beginPath(); c.moveTo(0, 12.5 * TILE);
    c.bezierCurveTo(10 * TILE, 9 * TILE, 25 * TILE, 16 * TILE, 37 * TILE, 12.5 * TILE);
    c.stroke();
  } else if (stage.theme === 'dungeon') {
    // 地下牢の床（暗い石）
    c.fillStyle = '#3a3632';
    c.fillRect(0, 0, W, H);
    for (let y = 0; y < stage.rows * 2; y++) {
      for (let x = 0; x < stage.cols * 2; x++) {
        const v = Math.floor(rnd() * 14) - 7;
        c.fillStyle = `rgb(${62 + v},${58 + v},${52 + v})`;
        c.fillRect(x * 20 + 1, y * 20 + 1, 18, 18);
      }
    }
    // 階段
    const [gx, gy, gw, gh] = stage.goal;
    for (let i = 0; i < 6; i++) {
      c.fillStyle = `rgb(${90 - i * 10},${85 - i * 10},${80 - i * 10})`;
      c.fillRect(gx * TILE, gy * TILE + i * gh * TILE / 6, gw * TILE, gh * TILE / 6 - 2);
    }
  } else {
    // 中庭の石畳
    c.fillStyle = '#8f8574';
    c.fillRect(0, 0, W, H);
    for (let y = 0; y < stage.rows * 2; y++) {
      for (let x = 0; x < stage.cols * 2; x++) {
        const v = Math.floor(rnd() * 20) - 10;
        c.fillStyle = `rgb(${143 + v},${133 + v},${116 + v})`;
        c.fillRect(x * 20 + 1, y * 20 + 1, 18, 18);
      }
    }
  }

  // 床の飾り（門の通路など）
  (stage.floors || []).forEach(f => {
    const [x, y, w, h] = f.rect;
    c.fillStyle = f.color;
    c.fillRect(x * TILE, y * TILE, w * TILE, h * TILE);
  });

  for (let y = 0; y < stage.rows; y++) {
    for (let x = 0; x < stage.cols; x++) {
      const px = x * TILE, py = y * TILE;
      if (grid[y][x] === 1 && desert) {
        // 岩
        c.fillStyle = '#6b5a48';
        c.fillRect(px, py, TILE, TILE);
        c.fillStyle = '#857057';
        c.beginPath();
        c.moveTo(px + 4 + rnd() * 6, py + 6 + rnd() * 6);
        c.lineTo(px + TILE - 6 - rnd() * 6, py + 4 + rnd() * 6);
        c.lineTo(px + TILE - 4 - rnd() * 6, py + TILE - 8 - rnd() * 6);
        c.lineTo(px + 6 + rnd() * 6, py + TILE - 6 - rnd() * 6);
        c.closePath(); c.fill();
        c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 1;
        c.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
      } else if (grid[y][x] === 1) {
        // 木箱
        c.fillStyle = '#8a5a2b';
        c.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
        c.strokeStyle = '#5a3a1a'; c.lineWidth = 3;
        c.strokeRect(px + 3.5, py + 3.5, TILE - 7, TILE - 7);
        c.beginPath();
        c.moveTo(px + 4, py + 4); c.lineTo(px + TILE - 4, py + TILE - 4);
        c.moveTo(px + TILE - 4, py + 4); c.lineTo(px + 4, py + TILE - 4);
        c.stroke();
      } else if (grid[y][x] === 4) {
        // 鉄格子
        c.fillStyle = '#2a2a2a';
        c.fillRect(px, py + TILE / 2 - 3, TILE, 6);
        c.fillStyle = '#777';
        for (let i = 4; i < TILE; i += 9) c.fillRect(px + i, py + 4, 3, TILE - 8);
      } else if (grid[y][x] === 3) {
        // 牢の扉（鍵穴付き）
        c.fillStyle = '#5a3a1a';
        c.fillRect(px + 2, py + 6, TILE - 4, TILE - 12);
        c.fillStyle = '#999';
        for (let i = 6; i < TILE - 4; i += 8) c.fillRect(px + i, py + 6, 2, TILE - 12);
        c.fillStyle = '#ffd54f';
        c.fillRect(px + TILE / 2 - 3, py + TILE / 2 - 4, 6, 8);
      } else if (grid[y][x] === 2) {
        // 城壁・建物（レンガ模様。地下牢は暗い色）
        c.fillStyle = stage.theme === 'dungeon' ? '#4b4750' : '#7d7d86';
        c.fillRect(px, py, TILE, TILE);
        c.strokeStyle = stage.theme === 'dungeon' ? '#2f2c33' : '#5a5a63'; c.lineWidth = 2;
        for (let r = 0; r < 4; r++) {
          const yy = py + r * 10;
          c.beginPath(); c.moveTo(px, yy); c.lineTo(px + TILE, yy); c.stroke();
          const off = (r % 2) * 10;
          for (let xx = px + off; xx < px + TILE; xx += 20) {
            c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx, yy + 10); c.stroke();
          }
        }
      }
    }
  }

  // 建物の名前など
  c.fillStyle = '#eee'; c.font = 'bold 16px sans-serif'; c.textAlign = 'center';
  (stage.labels || []).forEach(l => {
    c.fillStyle = 'rgba(0,0,0,0.5)';
    const w = c.measureText(l.text).width + 12;
    c.fillRect(l.x * TILE - w / 2, l.y * TILE - 16, w, 22);
    c.fillStyle = '#eee';
    c.fillText(l.text, l.x * TILE, l.y * TILE);
  });

  // 草むら（プレイヤーの上に重ねて描くので別の画像に）
  bushLayer = document.createElement('canvas');
  bushLayer.width = W; bushLayer.height = H;
  const b = bushLayer.getContext('2d');
  for (let y = 0; y < stage.rows; y++) {
    for (let x = 0; x < stage.cols; x++) {
      if (!bushGrid[y][x]) continue;
      const straw = stage.theme === 'dungeon';
      for (let i = 0; i < 6; i++) {
        b.fillStyle = straw ? ['#a8873a', '#c09a45', '#8c6f2c'][i % 3] : ['#4f6b2e', '#5f7d36', '#3f5a24'][i % 3];
        b.beginPath();
        b.arc(x * TILE + 6 + rnd() * 28, y * TILE + 6 + rnd() * 28, 9 + rnd() * 7, 0, Math.PI * 2);
        b.fill();
      }
    }
  }
}

// 見張りの視界（扇形）を、障害物でさえぎられた形で描く
function drawVision(g) {
  if (g.state === 'stun') return;
  const range = g.state === 'alert' ? VIEW_RANGE * 1.2 : VIEW_RANGE;
  const RAYS = 28;
  ctx.beginPath();
  ctx.moveTo(g.x, g.y);
  for (let i = 0; i <= RAYS; i++) {
    const a = g.dir - VIEW_ANGLE / 2 + VIEW_ANGLE * i / RAYS;
    const cos = Math.cos(a), sin = Math.sin(a);
    let d = 0;
    while (d < range) {
      if (solidAt(g.x + cos * d, g.y + sin * d)) break;
      d += 6;
    }
    ctx.lineTo(g.x + cos * d, g.y + sin * d);
  }
  ctx.closePath();
  if (g.state === 'alert') ctx.fillStyle = 'rgba(255,40,40,0.30)';
  else if (g.susp > 0.25 || g.state === 'search') ctx.fillStyle = 'rgba(255,150,0,0.30)';
  else ctx.fillStyle = 'rgba(255,240,80,0.22)';
  ctx.fill();
}

// サーチライトの光
function drawLight(l) {
  const grad = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
  const red = l.susp > 0;
  grad.addColorStop(0, red ? 'rgba(255,200,180,0.65)' : 'rgba(255,255,230,0.55)');
  grad.addColorStop(0.8, red ? 'rgba(255,160,140,0.35)' : 'rgba(255,255,220,0.30)');
  grad.addColorStop(1, 'rgba(255,255,220,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2); ctx.fill();
  if (l.susp > 0) {
    // 警報までのゲージ（円の周りに表示）
    ctx.strokeStyle = '#ff5030'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(l.x, l.y, l.r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * l.susp); ctx.stroke();
  }
}

// プレイヤーの視界（青い扇形）
function drawPlayerVision() {
  const RAYS = 24, p = player;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  for (let i = 0; i <= RAYS; i++) {
    const a = p.dir - PLAYER_VIEW_ANGLE / 2 + PLAYER_VIEW_ANGLE * i / RAYS;
    const cos = Math.cos(a), sin = Math.sin(a);
    let d = 0;
    while (d < PLAYER_VIEW_RANGE) {
      if (solidAt(p.x + cos * d, p.y + sin * d)) break;
      d += 6;
    }
    ctx.lineTo(p.x + cos * d, p.y + sin * d);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(70,140,255,0.24)';
  ctx.fill();
}

// 狙える見張りに照準マークを表示
function drawReticle(g) {
  const ready = player.cooldown <= 0 && player.ammo > 0;
  const r = 20 + Math.sin(elapsed * 8) * 2;
  ctx.strokeStyle = ready ? '#ff4040' : 'rgba(255,64,64,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(g.x - r - 6, g.y); ctx.lineTo(g.x - r + 6, g.y);
  ctx.moveTo(g.x + r - 6, g.y); ctx.lineTo(g.x + r + 6, g.y);
  ctx.moveTo(g.x, g.y - r - 6); ctx.lineTo(g.x, g.y - r + 6);
  ctx.moveTo(g.x, g.y + r - 6); ctx.lineTo(g.x, g.y + r + 6);
  ctx.stroke();
}

// 麻酔銃の弾道
function drawShots() {
  for (const s of shots) {
    ctx.strokeStyle = `rgba(200,255,255,${s.t * 4})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
}

// 弾薬箱
function drawItems() {
  for (const it of items) {
    if (it.taken) continue;
    const bob = Math.sin(elapsed * 4) * 2;
    if (it.kind === 'key') {
      // 鍵（金色）
      ctx.strokeStyle = '#ffd54f'; ctx.fillStyle = '#ffd54f'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(it.x - 6, it.y + bob, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.fillRect(it.x - 1, it.y - 1.5 + bob, 13, 3);
      ctx.fillRect(it.x + 7, it.y + bob, 3, 6);
      continue;
    }
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(it.x - 10, it.y - 8 + bob, 20, 16);
    ctx.strokeStyle = '#a5d6a7'; ctx.lineWidth = 2;
    ctx.strokeRect(it.x - 10, it.y - 8 + bob, 20, 16);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('弾', it.x, it.y + 4 + bob);
  }
}

function drawGuard(g) {
  ctx.save();
  ctx.translate(g.x, g.y);
  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(2, 4, GUARD_R, GUARD_R * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(g.dir);
  // 体（軍服）
  ctx.fillStyle = g.state === 'stun' ? '#6a6a55' : '#4d5a2a';
  ctx.beginPath(); ctx.arc(0, 0, GUARD_R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2b3216'; ctx.lineWidth = 2; ctx.stroke();
  // 銃
  ctx.fillStyle = '#222';
  ctx.fillRect(6, 4, 16, 4);
  // 頭（ターバン風）
  ctx.fillStyle = '#d8cfb8';
  ctx.beginPath(); ctx.arc(2, 0, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 頭上のマーク
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px sans-serif';
  if (g.state === 'stun') {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('z z', g.x, g.y - 20 - Math.sin(elapsed * 3) * 3);
  } else if (g.state === 'alert') {
    ctx.fillStyle = '#ff3030';
    ctx.fillText('!', g.x, g.y - 20);
  } else if (g.susp > 0.05 || g.state === 'search') {
    ctx.fillStyle = '#ffb000';
    ctx.fillText('?', g.x, g.y - 20);
    // 怪しさゲージ
    if (g.susp > 0.05) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(g.x - 14, g.y - 44, 28, 5);
      ctx.fillStyle = '#ffb000'; ctx.fillRect(g.x - 14, g.y - 44, 28 * g.susp, 5);
    }
  }
}

// 人質（白い服）。救出前は牢の中でしゃがんでいる
function drawHostage() {
  if (!hostage) return;
  if (hostage.joined) {
    const m = squad[squad.length - 1];
    drawSoldier(m.x, m.y, m.dir, 0.9, '#e8e4da', '#ffd54f', player.walk + 20);
  } else {
    drawSoldier(hostage.x, hostage.y, Math.PI / 2, 0.9, '#e8e4da', '#ffd54f', 0);
    ctx.fillStyle = '#ffd54f'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('人質', hostage.x, hostage.y - 18);
  }
}

// たいまつ（炎がゆらめく）
function drawTorches() {
  for (const [tx, ty] of stage.torches || []) {
    const x = tx * TILE, y = ty * TILE;
    const f = Math.sin(elapsed * 13 + tx) * 2;
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(x - 2, y, 4, 10);
    ctx.fillStyle = '#ff9800';
    ctx.beginPath(); ctx.ellipse(x, y - 2, 5, 8 + f, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath(); ctx.ellipse(x, y, 2.5, 4 + f / 2, 0, 0, Math.PI * 2); ctx.fill();
  }
}

// 暗闇：画面全体を暗くし、明かりのある場所だけくり抜く
function drawDarkness(camX, camY) {
  if (!darkCanvas) darkCanvas = document.createElement('canvas');
  if (darkCanvas.width !== canvas.width || darkCanvas.height !== canvas.height) {
    darkCanvas.width = canvas.width; darkCanvas.height = canvas.height;
  }
  const d = darkCanvas.getContext('2d');
  const k = dpr * zoom;
  d.globalCompositeOperation = 'source-over';
  d.fillStyle = 'rgba(0,0,6,0.93)';
  d.fillRect(0, 0, darkCanvas.width, darkCanvas.height);
  d.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r) => {
    const sx = (x - camX) * k, sy = (y - camY) * k, sr = r * k;
    const g = d.createRadialGradient(sx, sy, sr * 0.25, sx, sy, sr);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    d.fillStyle = g;
    d.beginPath(); d.arc(sx, sy, sr, 0, Math.PI * 2); d.fill();
  };
  const flick = Math.sin(elapsed * 9) * 6;
  hole(player.x, player.y, 210 + flick);                       // 先頭の明かり
  for (const [tx, ty] of stage.torches || []) hole(tx * TILE, ty * TILE, 140 + Math.sin(elapsed * 11 + tx) * 8);
  for (const g of guards) hole(g.x, g.y, g.state === 'stun' ? 30 : 60);   // 見張りのランタン
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(darkCanvas, 0, 0);
  ctx.setTransform(k, 0, 0, k, -camX * k, -camY * k);
}

// 後ろの隊員（先頭より少し小さく、色も少し変える）。後ろから順に描く
function drawSquad() {
  if (player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0) return;  // 捕まった直後は点滅
  for (let i = SQUAD_SIZE - 1; i >= 1; i--) {
    const m = squad[i];
    drawSoldier(m.x, m.y, m.dir, 0.85, '#3a4a5e', '#7fa3d6', player.walk + i);
  }
  drawSoldier(player.x, player.y, player.dir, 1, '#2d3e55', '#9ec3ff', player.walk);
  // 先頭の目印
  ctx.fillStyle = '#9ec3ff';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 22); ctx.lineTo(player.x - 5, player.y - 30); ctx.lineTo(player.x + 5, player.y - 30);
  ctx.closePath(); ctx.fill();
}

function drawSoldier(x, y, dir, scale, body, rim, walk) {
  const p = { x, y, dir, crouch: player.crouch, walk };
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(2, 4, PLAYER_R, PLAYER_R * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(p.dir);
  const sx = p.crouch ? 1.25 : 1, sy = p.crouch ? 0.8 : 1;   // ほふく中は平たく
  ctx.scale(sx, sy);
  // 足（歩くと動く）
  const swing = Math.sin(p.walk) * 5;
  ctx.fillStyle = '#1f2a3a';
  ctx.fillRect(-6 + swing, -8, 8, 5);
  ctx.fillRect(-6 - swing, 3, 8, 5);
  // 体（潜入用の黒い装備）
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.arc(0, 0, PLAYER_R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = rim; ctx.lineWidth = 2; ctx.stroke();
  // 頭
  ctx.fillStyle = '#e0b48a';
  ctx.beginPath(); ctx.arc(3, 0, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(1, 0, 6, Math.PI * 0.5, Math.PI * 1.5); ctx.fill();
  ctx.restore();
}

function drawGoal() {
  const [gx, gy, gw, gh] = stage.goal;
  if (stage.needHostage && !(hostage && hostage.joined)) {
    ctx.fillStyle = '#ccc'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(stage.goalLabel, (gx + gw / 2) * TILE, (gy + gh / 2) * TILE + 5);
    return;
  }
  const a = 0.35 + Math.sin(elapsed * 4) * 0.2;
  ctx.fillStyle = `rgba(120,255,160,${a})`;
  ctx.fillRect(gx * TILE, gy * TILE, gw * TILE, gh * TILE);
  ctx.strokeStyle = '#8f8'; ctx.lineWidth = 2;
  ctx.strokeRect(gx * TILE, gy * TILE, gw * TILE, gh * TILE);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(stage.goalLabel, (gx + gw / 2) * TILE, (gy + gh / 2) * TILE + 5);
}

// 左上の情報パネルの下端の位置（画面のピクセル）
function hudBottom() {
  const extra = stage.needHostage ? 22 : 0;
  return window.innerWidth < 460 ? 116 + extra + 32 : 10 + 100 + extra + 6;
}

// 画面上の情報（警戒度・弾数・ヒントなど）
function drawHUD() {
  const W = window.innerWidth, H = window.innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // ステージ名・警戒度・弾数・部隊
  const extra = stage.needHostage ? 22 : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(10, 10, 230, 100 + extra);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(stage.name, 20, 30);
  ctx.font = '12px sans-serif';
  ctx.fillText('警戒度', 20, 52);
  ctx.fillStyle = '#333'; ctx.fillRect(68, 42, 160, 14);
  const col = alertLevel < 40 ? '#4caf50' : alertLevel < 75 ? '#ffb300' : '#ff3b30';
  ctx.fillStyle = col; ctx.fillRect(68, 42, 160 * alertLevel / 100, 14);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'right';
  ctx.fillText(Math.floor(alertLevel) + '%', 226, 53);
  ctx.textAlign = 'left';
  ctx.fillText('麻酔弾', 20, 76);
  for (let i = 0; i < Math.min(player.ammo, 12); i++) {
    ctx.fillStyle = '#9ef';
    ctx.fillRect(68 + i * 13, 67, 8, 12);
  }
  if (player.ammo === 0) { ctx.fillStyle = '#f66'; ctx.fillText('弾切れ', 68, 76); }
  // 部隊の人数（人の形のマークを10個並べる）
  ctx.fillStyle = '#fff'; ctx.fillText('部隊', 20, 98);
  for (let i = 0; i < SQUAD_SIZE; i++) {
    const x = 74 + i * 15, y = 92;
    ctx.fillStyle = i === 0 ? '#9ec3ff' : '#7fa3d6';
    ctx.beginPath(); ctx.arc(x, y - 3, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(x - 4, y + 1, 8, 7);
  }
  if (stage.needHostage) {
    ctx.fillStyle = hasKey ? '#ffd54f' : '#888';
    ctx.fillText(hasKey ? '鍵：あり' : '鍵：なし', 20, 120);
    ctx.fillStyle = hostage && hostage.joined ? '#ffd54f' : '#888';
    ctx.fillText(hostage && hostage.joined ? '人質：救出' : '人質：未救出', 110, 120);
  }

  // 状態表示（ほふく／隠れている）
  ctx.font = 'bold 14px sans-serif';
  let status = player.crouch ? 'ほふく中' : '通常';
  const nHidden = squad.filter(hidden).length;
  if (nHidden === squad.length) status = '全員 隠れている';
  else if (nHidden > 0) status = `${nHidden}人 隠れている`;
  // 画面が狭い（スマホ縦）ときは、ステージ名の下に並べる
  const narrow = W < 460;
  const sx = narrow ? 10 : W - 190, sy = narrow ? 116 + extra : 10;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(sx, sy, 180, 28);
  ctx.fillStyle = player.crouch ? '#9ec3ff' : '#fff';
  ctx.fillText(status, sx + 10, sy + 19);

  // 狙える見張りがいる時の案内
  if (findShotTarget()) {
    const msg = player.ammo <= 0 ? '弾切れ' : player.cooldown > 0 ? '装填中…' : 'ACTION：麻酔銃';
    ctx.fillStyle = player.ammo > 0 && player.cooldown <= 0 ? 'rgba(200,40,40,0.8)' : 'rgba(120,40,40,0.8)';
    ctx.fillRect(sx, sy + 34, 180, 28);
    ctx.fillStyle = '#fff';
    ctx.fillText(msg, sx + 10, sy + 53);
  }

  // 見つかった時は画面のふちを赤く
  if (guards.some(g => g.state === 'alert')) {
    ctx.strokeStyle = `rgba(255,0,0,${0.4 + Math.sin(elapsed * 10) * 0.2})`;
    ctx.lineWidth = 12;
    ctx.strokeRect(0, 0, W, H);
  }
  // 捕まった時は画面全体を赤く光らせる
  if (flashTimer > 0) {
    ctx.fillStyle = `rgba(255,0,0,${flashTimer * 0.8})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ヒント：画面の一番下（操作ボタンの上）に数秒だけ表示し、だんだん消える
  if (hintTimer > 0 && hintText) {
    ctx.globalAlpha = Math.min(1, hintTimer);
    const maxW = Math.min(W - 20, 520);
    drawTextBox(hintText, W / 2, H - (narrow ? 210 : 70), maxW, true);
    ctx.globalAlpha = 1;
  }
}

// 折り返し付きのメッセージボックス（bottom が true なら top は下端の位置）
function drawTextBox(text, cx, top, maxW, bottom) {
  ctx.font = '13px sans-serif';
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxW - 20) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  const h = lines.length * 18 + 10;
  if (bottom) top -= h;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(cx - maxW / 2, top, maxW, h);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  lines.forEach((l, i) => ctx.fillText(l, cx, top + 19 + i * 18));
}

// 文字が画面からはみ出さないよう、必要なら小さくして描く
function fitText(text, x, y, size, bold, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px sans-serif`;
  const w = ctx.measureText(text).width;
  if (w > maxW) ctx.font = `${bold ? 'bold ' : ''}${Math.floor(size * maxW / w)}px sans-serif`;
  ctx.fillText(text, x, y);
}

// タイトル・クリア・ゲームオーバーなどの全画面表示
function drawScreen(title, sub, lines, color, footer) {
  const W = window.innerWidth, H = window.innerHeight;
  const maxW = W - 24;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  fitText(title, W / 2, H * 0.22, 40, true, maxW);
  ctx.fillStyle = '#ccc';
  fitText(sub, W / 2, H * 0.22 + 38, 18, false, maxW);
  ctx.fillStyle = '#eee';
  lines.forEach((l, i) => fitText(l, W / 2, H * 0.36 + i * 24, 15, false, maxW));
  ctx.fillStyle = `rgba(255,255,255,${0.6 + Math.sin(performance.now() / 300) * 0.4})`;
  fitText(footer || 'SPACE / ACTIONボタン / タップ で進む', W / 2, H * 0.84, 18, true, maxW);
}

// タイトル画面の背景（簡単な城のシルエット）
function drawTitleBG() {
  const W = window.innerWidth, H = window.innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1b1f3a'); grad.addColorStop(0.7, '#6b4a3a'); grad.addColorStop(1, '#b89a6a');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#111';
  const base = H * 0.72, cx = W / 2;
  ctx.fillRect(cx - 160, base - 90, 320, 90);
  for (let i = -160; i < 160; i += 30) ctx.fillRect(cx + i, base - 106, 18, 16);
  ctx.fillRect(cx - 40, base - 170, 80, 80);
  ctx.fillRect(cx - 200, base - 130, 50, 130);
  ctx.fillRect(cx + 150, base - 130, 50, 130);
  ctx.fillStyle = '#ffcf6a';
  ctx.fillRect(cx - 8, base - 150, 16, 22);
}

// タイトル画面のステージ選択ボタン
function drawStageButtons() {
  const W = window.innerWidth, H = window.innerHeight;
  const bw = Math.min(150, (W - 40) / STAGES.length - 10), bh = 48;
  const total = STAGES.length * (bw + 10) - 10;
  titleButtons = [];
  STAGES.forEach((s, i) => {
    const x = W / 2 - total / 2 + i * (bw + 10), y = H * 0.66;
    const locked = i >= unlocked;
    titleButtons.push({ x, y, w: bw, h: bh, index: i, locked });
    ctx.fillStyle = locked ? 'rgba(60,60,60,0.8)' : i === titleSelect ? 'rgba(255,207,106,0.9)' : 'rgba(30,30,40,0.85)';
    ctx.fillRect(x, y, bw, bh);
    ctx.strokeStyle = '#ffcf6a'; ctx.lineWidth = 2; ctx.strokeRect(x, y, bw, bh);
    ctx.fillStyle = i === titleSelect && !locked ? '#111' : locked ? '#888' : '#fff';
    ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('STAGE ' + (i + 1), x + bw / 2, y + 20);
    ctx.font = '11px sans-serif';
    ctx.fillText(locked ? '🔒 未解放' : s.name.replace(/^STAGE \d+\s+/, ''), x + bw / 2, y + 38);
  });
}

function render() {
  document.body.classList.toggle('menu', scene !== 'play');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (scene === 'title') {
    drawTitleBG();
    drawScreen('潜入作戦 ジャキ城奪還', '― ドラマ「VIVANT」モチーフのファンメイド潜入アクション ―', [
      '10人の部隊で一列に潜入。見張りの視界とサーチライトを避けろ',
      '移動：矢印キー / 左下パッド',
      '麻酔銃：SPACE / ACTION（青い視界の中の敵を眠らせる）',
      'ほふく：C / ほふくボタン　　音のON/OFF：M / 🔊',
    ], '#ffcf6a', 'ステージを選んで SPACE / タップ で開始');
    drawStageButtons();
    return;
  }

  // --- カメラ：プレイヤーを中心に、ステージの外は映さない ---
  // ただし上端では、左上の情報パネルに部隊が隠れないよう、その分だけ下げて映す
  const W = stage.cols * TILE, H = stage.rows * TILE;
  const topPad = hudBottom() / zoom;
  let camX = player.x - viewW / 2, camY = player.y - viewH / 2;
  camX = viewW >= W ? (W - viewW) / 2 : Math.max(0, Math.min(W - viewW, camX));
  camY = Math.max(-topPad, Math.min(H - viewH, camY));
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, -camX * dpr * zoom, -camY * dpr * zoom);

  ctx.drawImage(staticLayer, 0, 0);
  drawGoal();
  drawItems();
  drawTorches();
  drawPlayerVision();
  const dark = stage.theme === 'dungeon';
  if (!dark) guards.forEach(drawVision);
  drawHostage();
  drawSquad();
  guards.forEach(drawGuard);
  // 草むらはプレイヤーの上に半透明で重ねる（隠れている感じを出す）
  ctx.globalAlpha = 0.8;
  ctx.drawImage(bushLayer, 0, 0);
  ctx.globalAlpha = 1;
  // 地下牢は暗闇を重ね、見張りの視界だけは暗闇の上に描く（見張りの位置の手がかり）
  if (dark) { drawDarkness(camX, camY); guards.forEach(drawVision); }
  lights.forEach(drawLight);
  const target = scene === 'play' ? findShotTarget() : null;
  if (target) drawReticle(target);
  drawShots();

  drawHUD();

  if (scene === 'clear') {
    const next = STAGES[stageIndex + 1];
    drawScreen(`STAGE ${stageIndex + 1} CLEAR`, stage.clearText, [
      `タイム：${elapsed.toFixed(1)} 秒　／　最終警戒度：${Math.floor(alertLevel)}%`,
      next ? `次は「${next.name.replace(/^STAGE \d+\s+/, '')}」` : '次は「脱出」…（ステージ4は今後追加予定）',
    ], '#8f8', next ? 'SPACE / タップ で次のステージへ' : 'SPACE / タップ でタイトルへ');
  } else if (scene === 'over') {
    drawScreen('GAME OVER', overReason, ['もう一度挑戦する'], '#ff5050');
  }
}

/* =========================================================
   メインループ
   ========================================================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);  // 処理落ち時に飛びすぎないよう上限
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
